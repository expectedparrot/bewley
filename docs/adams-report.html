    const data = {"generated_at": "2026-07-23T19:54:15Z", "project_root": "/Users/johnhorton/tools/ep/bewley/examples/adams-letters", "code_count": 7, "snippet_count": 23, "document_count": 14, "codes": [{"code_id": "8d116d79bb5642278dbc5b4c84861a33", "name": "public_duty", "description": null, "status": "active", "annotation_count": 4, "document_count": 4, "display_color": "hsl(132 68% 52%)", "aliases": []}, {"code_id": "55b8d127cd43465d8d116cffa0aaa569", "name": "war_and_danger", "description": null, "status": "active", "annotation_count": 4, "document_count": 3, "display_color": "hsl(226 68% 52%)", "aliases": []}, {"code_id": "2920aa0b0151460cb035f27d82fd4ad0", "name": "health_and_scarcity", "description": null, "status": "active", "annotation_count": 3, "document_count": 3, "display_color": "hsl(305 68% 52%)", "aliases": []}, {"code_id": "18205d26e6804aa8b37b09b6c5429251", "name": "household_responsibility", "description": null, "status": "active", "annotation_count": 3, "document_count": 3, "display_color": "hsl(152 68% 52%)", "aliases": []}, {"code_id": "f54e4380d2684b07904260dacf3a4d9a", "name": "information_and_delay", "description": null, "status": "active", "annotation_count": 3, "document_count": 3, "display_color": "hsl(194 68% 52%)", "aliases": []}, {"code_id": "13919b828dff413d9fcd5d7b66f8984d", "name": "political_voice", "description": null, "status": "active", "annotation_count": 3, "document_count": 2, "display_color": "hsl(83 68% 52%)", "aliases": []}, {"code_id": "86e7daed85cf445d84347cfeff54fc2b", "name": "separation_and_affection", "description": null, "status": "active", "annotation_count": 3, "document_count": 3, "display_color": "hsl(299 68% 52%)", "aliases": []}], "snippets": [{"annotation_id": "c6fa66d5c12542279ad2da7a9e4e2287", "code_id": "2920aa0b0151460cb035f27d82fd4ad0", "code_name": "health_and_scarcity", "code_color": "hsl(305 68% 52%)", "document_path": "corpus/1775-august-10-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 15, "anchor_status": "clean", "memo": null, "exact_text": "Dearest Friend,--'T is with a sad heart I take my pen to write to you, because I must be the bearer of what will greatly afflict and distress you. Yet I wish you to be prepared for the event. Your brother Elihu lies very dangerously sick with a dysentery. He has been very bad for more than a week. His life is despaired of. Ere I close this letter, I fear I shall write you that he is no more.\n\nWe are all in great distress. Your father is with him in great anguish. I hear this morning that he is sensible of his danger, and calmly resigned to the will of Heaven, which is a great satisfaction to his mourning friends. I cannot write more at present than to assure you of the health of your own family. Mr. Elisha Niles was very bad with the same disorder.\n\n11 August.\n\nI have this morning occasion to sing of mercies and judgments. May I properly notice each. A mixture of joy and grief agitates my bosom. The return of thee, my dear partner, after a four months' absence, is a pleasure I cannot express; but the joy is overclouded, and the day is darkened, by the mixture of grief,--the sympathy I feel for the loss of your brother, cut off in the pride of life and the bloom of manhood, in the midst of his usefulness. Heaven sanctify this affliction to us, and make me properly thankful that it is not my sad lot to mourn the loss of a husband in the room of a brother.\n\nMay thy life be spared and thy health confirmed for the benefit of thy country and the happiness of thy family, is the constant supplication of thy friend.\n"}, {"annotation_id": "b012c48647494b15be39e359dacdb25d", "code_id": "2920aa0b0151460cb035f27d82fd4ad0", "code_name": "health_and_scarcity", "code_color": "hsl(305 68% 52%)", "document_path": "corpus/1775-october-23-john-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I feel myself much affected with the breach upon the family. But we can count a mother, a brother, an aunt, and a brother's child among the slain by this cruel pestilence. May God Almighty put a stop to its rage, and humble us under the ravages already made by it. The sorrows of all our friends, on the loss of your mother, are never out of my mind. I pray God to spare my parent, whose life has been prolonged by his goodness hitherto, as well as yours that survives. The tremendous calamities already felt, of fire, sword, and pestilence, may be only harbingers of greater still. We have no security against calamity here. This planet is its region. The only principle is to be prepared for the worst events.\n"}, {"annotation_id": "4e6b317906cd493da9fb64754c4a83f4", "code_id": "2920aa0b0151460cb035f27d82fd4ad0", "code_name": "health_and_scarcity", "code_color": "hsl(305 68% 52%)", "document_path": "corpus/1776-july-13-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "I must begin with apologizing to you for not writing since the 17th of June. I have really had so many cares upon my hands and mind, with a bad inflammation in my eyes, that I have not been able to write. I now date from Boston, where I yesterday arrived and was with all of our little ones inoculated for the small-pox....\n"}, {"annotation_id": "a8c09d7511aa4c418c356cf3cbaa6ecd", "code_id": "18205d26e6804aa8b37b09b6c5429251", "code_name": "household_responsibility", "code_color": "hsl(152 68% 52%)", "document_path": "corpus/1775-december-10-abigail-adams.txt", "scope_type": "span", "start_line": 15, "end_line": 15, "anchor_status": "clean", "memo": null, "exact_text": "By the way, I congratulate you upon our late noble acquisition of military stores. It is a most grand mortar, I assure you. Surely Heaven smiles upon us, in many respects, and we have continually to speak of mercies, as well as of judgments. I wish our gratitude may be anywise proportionate to our benefits. I suppose, in Congress, you think of everything relative to trade and commerce, as well as other things; but, as I have been desired to mention to you some things, I shall not omit them. One is, that there may be something done, in a Continental way, with regard to excise upon spirituous liquors, that each of the New England colonies may be upon the same footing; whereas we formerly used to pay an excise, and the other colonies none, or very little, by which means they drew away our trade. An excise is necessary, though it may be objected to by the mercantile interest, as a too frequent use of spirits endangers the well-being of society. Another article is, that some method may be devised to keep among us our gold and silver, which are now every day shipped off to the West Indies for molasses, coffee, and sugar; and this I can say of my own knowledge, that a dollar in silver is now become a great rarity, and our traders will give you a hundred pounds of paper for ninety of silver, or nearly that proportion. If any trade is allowed to the West Indies, would it not be better to carry some commodity of our own produce in exchange? Medicines, cotton-wool, and some other articles, we are in great want of. Formerly we used to purchase cotton-wool at one shilling, lawful money, per bag; now it is three, and the scarcity of that article distresses us, as it was wrought up with less trouble than any other article of clothing. Flax is now from a shilling to one and sixpence per pound, sheep's wool eighteenpence, and linens not to be had at any price. I cannot mention the article in the English goods way which is not double; and in the West India molasses by retail I used formerly to purchase at one and eightpence, now it is two and eightpence; rum, three shillings; coffee, one and threepence, and all other things in proportion. Corn is four shillings per bushel; rye, five; oats, three and eightpence; hay, five and six shillings per hundred; wood, twenty shillings per cord; but meat of all kinds cheap.\n"}, {"annotation_id": "8671cc3227b844898c2000bcebf02f89", "code_id": "18205d26e6804aa8b37b09b6c5429251", "code_name": "household_responsibility", "code_color": "hsl(152 68% 52%)", "document_path": "corpus/1776-june-03-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "I received by Mr. Church a few lines from you. I wish to hear from you every opportunity, though you say no more than that you are well. I feel concerned lest your clothes should go to rags, having nobody to take any care of you in your long absence; and then, you have not with you a proper change for the seasons. However, you must do the best you can. I have a suit of homespun for you whenever you return. I cannot avoid sometimes repining that the gifts of fortune were not bestowed upon us, that I might have enjoyed the happiness of spending my days with my partner, but as it is, I think it my duty to attend with frugality and economy to our own private affairs; and if I cannot add to our little substance, yet see it that it is not diminished. I should enjoy but little comfort in a state of idleness and uselessness. Here I can serve my partner, my family, and myself, and enjoy the satisfaction of your serving your country.\n"}, {"annotation_id": "ad3f42124d964a04a0572c3b16187d8a", "code_id": "18205d26e6804aa8b37b09b6c5429251", "code_name": "household_responsibility", "code_color": "hsl(152 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 25, "end_line": 25, "anchor_status": "clean", "memo": null, "exact_text": "I want to hear much oftener from you than I do. March 8th was the last date of any that I have yet had. You inquire of me whether I am making saltpetre. I have not yet attempted it, but after soap-making believe I shall make the experiment. I find as much as I can do to manufacture clothing for my family, which would else be naked. I know of but one person in this part of the town who has made any. That is Mr. Tertius Bass, as he is called, who has got very near a hundred-weight which has been found to be very good. I have heard of some others in the other parishes. Mr. Reed, of Weymouth, has been applied to, to go to Andover to the mills which are now at work, and he has gone.\n"}, {"annotation_id": "1f318a7383584d34b0b4760261fcf828", "code_id": "f54e4380d2684b07904260dacf3a4d9a", "code_name": "information_and_delay", "code_color": "hsl(194 68% 52%)", "document_path": "corpus/1775-june-15-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "I sat down to write to you on Monday, but really could not compose myself sufficiently; the anxiety I suffered from not hearing one syllable from you for more than five weeks, and the new distress arising from the arrival of recruits, agitated me more than I have been since the never-to-be-forgotten 14th of April. I have been much revived by receiving two letters from you last night; one by the servant of your friend, and the other by the gentlemen you mention, though they both went to Cambridge, and I have not seen them. I hope to send this as a return to you.\n"}, {"annotation_id": "7a48510efdab49f088586b4c551bf09b", "code_id": "f54e4380d2684b07904260dacf3a4d9a", "code_name": "information_and_delay", "code_color": "hsl(194 68% 52%)", "document_path": "corpus/1776-july-13-abigail-adams.txt", "scope_type": "span", "start_line": 13, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "By yesterday's post I received two letters dated 3d and 4th of July, and though your letters never fail to give me pleasure, be the subject what it will, yet it was greatly heightened by the prospect of the future happiness and glory of our country. Nor am I a little gratified when I reflect that a person so nearly connected with me has had the honor of being a principal actor in laying a foundation for its future greatness.\n"}, {"annotation_id": "c57d6b16866d4f218ddb5376a06a01c7", "code_id": "f54e4380d2684b07904260dacf3a4d9a", "code_name": "information_and_delay", "code_color": "hsl(194 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 25, "end_line": 25, "anchor_status": "clean", "memo": null, "exact_text": "I want to hear much oftener from you than I do. March 8th was the last date of any that I have yet had. You inquire of me whether I am making saltpetre. I have not yet attempted it, but after soap-making believe I shall make the experiment. I find as much as I can do to manufacture clothing for my family, which would else be naked. I know of but one person in this part of the town who has made any. That is Mr. Tertius Bass, as he is called, who has got very near a hundred-weight which has been found to be very good. I have heard of some others in the other parishes. Mr. Reed, of Weymouth, has been applied to, to go to Andover to the mills which are now at work, and he has gone.\n"}, {"annotation_id": "361d4febe8984d898dd3814f8eed85dd", "code_id": "13919b828dff413d9fcd5d7b66f8984d", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1776-april-14-john-adams.txt", "scope_type": "span", "start_line": 13, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "As to your extraordinary code of laws, I cannot but laugh. We have been told that our struggle has loosened the bonds of government everywhere; that children and apprentices were disobedient; that schools and colleges were grown turbulent; that Indians slighted their guardians, and negroes grew insolent to their masters. But your letter was the first intimation that another tribe, more numerous and powerful than all the rest, were grown discontented. This is rather too coarse a compliment, but you are so saucy, I won't blot it out. Depend upon it, we know better than to repeal our masculine systems. Although they are in full force, you know they are little more than theory. We dare not exert our power in its full latitude. We are obliged to go fair and softly, and, in practice, you know we are the subjects. We have only the name of masters, and rather than give up this, which would completely subject us to the despotism of the petticoat, I hope General Washington and all our brave heroes would fight; I am sure every good politician would plot, as long as he would against despotism, empire, monarchy, aristocracy, oligarchy, or ochlocracy. A fine story, indeed! I begin to think the ministry as deep as they are wicked. After stirring up Tories, land-jobbers, trimmers, bigots, Canadians, Indians, negroes, Hanoverians, Hessians, Russians, Irish Roman Catholics, Scotch renegadoes, at last they have stimulated the ---- to demand new privileges and threaten to rebel.\n"}, {"annotation_id": "2476f54a367a4f09bef790a4d4138065", "code_id": "13919b828dff413d9fcd5d7b66f8984d", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I have sometimes been ready to think that the passion for liberty cannot be equally strong in the breasts of those who have been accustomed to deprive their fellow-creatures of theirs. Of this I am certain, that it is not founded upon that generous and Christian principle of doing to others as we would that others should do unto us.\n"}, {"annotation_id": "088c028d74de4682add69d0b89f57749", "code_id": "13919b828dff413d9fcd5d7b66f8984d", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 19, "end_line": 21, "anchor_status": "clean", "memo": null, "exact_text": "I long to hear that you have declared an independency. And, by the way, in the new code of laws which I suppose it will be necessary for you to make, I desire you would remember the ladies and be more generous and favorable to them than your ancestors. Do not put such unlimited power into the hands of the husbands. Remember, all men would be tyrants if they could. If particular care and attention is not paid to the ladies, we are determined to foment a rebellion, and will not hold ourselves bound by any laws in which we have no voice or representation.\n\nThat your sex are naturally tyrannical is a truth so thoroughly established as to admit of no dispute; but such of you as wish to be happy willingly give up the harsh title of master for the more tender and endearing one of friend. Why, then, not put it out of the power of the vicious and the lawless to use us with cruelty and indignity with impunity? Men of sense in all ages abhor those customs which treat us only as the vassals of your sex; regard us then as beings placed by Providence under your protection, and in imitation of the Supreme Being make use of that power only for our happiness.\n"}, {"annotation_id": "f97434ab7e2549c590fe5fa16075a05b", "code_id": "8d116d79bb5642278dbc5b4c84861a33", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1775-april-30-john-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "relocated", "memo": null, "exact_text": "New York has appointed an ample representation in our Congress, and has appointed a Provincial Congress. The people of the city have seized the city arms and ammunition out of the hands of the mayor, who is a creature of the Governor. Lord North will certainly be disappointed in his expectation of seducing New York. The Tories there durst not show their heads. The Jerseys are aroused, and greatly assist the friends of liberty in New York. North Carolina has done bravely; chosen the old delegates in Provincial Congress, and then confirmed the choice in General Assembly, in opposition to all that Governor Martin could do. The Assembly of this colony is now sitting at Hartford. We are treated with great tenderness, sympathy, friendship, and respect. Everything is doing by this colony that can be done by men, both for New York and Boston. Keep your spirits composed and calm, and don't suffer yourself to be disturbed by idle reports and frivolous alarms. We shall see better times yet. Lord North is insuring us success. I am wounded to the heart with the news, this moment told me, of Josiah Quincy's death.\n"}, {"annotation_id": "89e07ba4138f46b6adb6eda463ddbcd1", "code_id": "8d116d79bb5642278dbc5b4c84861a33", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1775-december-03-john-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "My best Friend,--Yours of November 12th is before me. I wish I could write you every day, more than once, for although I have a number of friends and many relations who are very dear to me, yet all the friendship I have for others is far unequal to that which warms my heart for you. The most agreeable time that I spend here is in writing to you, and conversing with you, when I am alone. But the call of friendship and of private affection must give place to that of duty and honor. Even private friendship and affections require it.\n"}, {"annotation_id": "2fd25989aa2d4ab5b2675d4e8879a41b", "code_id": "8d116d79bb5642278dbc5b4c84861a33", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1775-june-11-john-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "I can now inform you that the Congress have made choice of the modest and virtuous, the amiable, generous, and brave George Washington, Esquire, to be General of the American army, and that he is to repair, as soon as possible, to the camp before Boston. This appointment will have a great effect in cementing and securing the union of these colonies. The continent is really in earnest, in defending the country. They have voted ten companies of riflemen to be sent from Pennsylvania, Maryland, and Virginia, to join the army before Boston. These are an excellent species of light infantry. They use a peculiar kind of musket, called a rifle. It has circular or ---- grooves within the barrel, and carries a ball with great exactness to great distances. They are the most accurate marksmen in the world.\n\nI begin to hope we shall not sit all summer. I hope the people of our province will treat the General with all that confidence and affection, that politeness and respect, which is due to one of the most important characters in the world. The liberties of America depend upon him, in a great degree. I have never been able to obtain from our province any regular and particular intelligence, since I left it. Kent, Swift, Tudor, Dr. Cooper, Dr. Winthrop, and others wrote me often last fall; not a line from them this time.\n"}, {"annotation_id": "a6f6c1a5fe0d424ca1a583fe3f267523", "code_id": "8d116d79bb5642278dbc5b4c84861a33", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1776-july-03-john-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "Had a Declaration of Independency been made seven months ago, it would have been attended with many great and glorious effects. We might, before this hour, have formed alliances with foreign states. We should have mastered Quebec, and been in possession of Canada. You will perhaps wonder how such a declaration would have influenced our affairs in Canada, but if I could write with freedom, I could easily convince you that it would, and explain to you the manner how. Many gentlemen in high stations, and of great influence, have been duped by the ministerial bubble of Commissioners to treat. And in real, sincere expectation of this event, which they so fondly wished, they have been slow and languid in promoting measures for the reduction of that province. Others there are in the Colonies who really wished that our enterprise in Canada would be defeated, that the Colonies might be brought into danger and distress between two fires, and be thus induced to submit. Others really wished to defeat the expedition to Canada, lest the conquest of it should elevate the minds of the people too much to hearken to those terms of reconciliation which, they believed, would be offered us. These jarring views, wishes, and designs occasioned an opposition to many salutary measures which were proposed for the support of that expedition, and caused obstructions, embarrassments, and studied delays, which have finally lost us the province.\n\nAll these causes, however, in conjunction would not have disappointed us, if it had not been for a misfortune which could not be foreseen, and perhaps could not have been prevented; I mean the prevalence of the small-pox among our troops. This fatal pestilence completed our destruction. It is a frown of Providence upon us, which we ought to lay to heart.\n"}, {"annotation_id": "7c5b46db42924cc7a8726c28bb36fd73", "code_id": "86e7daed85cf445d84347cfeff54fc2b", "code_name": "separation_and_affection", "code_color": "hsl(299 68% 52%)", "document_path": "corpus/1775-december-03-john-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "My best Friend,--Yours of November 12th is before me. I wish I could write you every day, more than once, for although I have a number of friends and many relations who are very dear to me, yet all the friendship I have for others is far unequal to that which warms my heart for you. The most agreeable time that I spend here is in writing to you, and conversing with you, when I am alone. But the call of friendship and of private affection must give place to that of duty and honor. Even private friendship and affections require it.\n\nI am obliged, by the nature of the service I am in, to correspond with many gentlemen, both of the army and of the two houses of Assembly, which takes up much of my time. How I find time to write half the letters I do, I know not, for my whole time seems engrossed with business. The whole Congress is taken up, almost, in different committees, from seven to ten in the morning. From ten to four or sometimes five, we are in Congress, and from six to ten in committees again. I don't mention this to make you think me a man of importance, because it is not I alone, but the whole Congress is thus employed, but to apologize for not writing to you oftener.\n\nIndeed, I know not what to write that is worth your reading. I send you the papers, which inform you of what is public. As to what passes in Congress, I am tied fast by my honor to communicate nothing. I hope the Journal of the Session will be published soon, and then you will see what we have been about in one view, excepting what ought to be excepted. If I could visit the coffee-houses in the evening, and the coffee-tables of the ladies in the afternoon, I could entertain you with many smart remarks upon dress and air, etc., and give you many sprightly conversations, but my fate, you know, is to be moping over books and papers all the leisure time I have, when I have any.\n\nI hope I shall be excused from coming to Philadelphia again, at least until other gentlemen have taken their turns. But I never will come here again without you, if I can persuade you to come with me. Whom God has joined together ought not to be put asunder so long, with their own consent. We will bring master Johnny with us; you and he shall have the small-pox here, and we will be as happy as Mr. Hancock and his lady. Thank Abby and John for their letters, and kiss Charles and Tom for me. John writes like a hero, glowing with ardor for his country and burning with indignation against her enemies.\n"}, {"annotation_id": "76a778d26ac347d2838d5be29db05a50", "code_id": "86e7daed85cf445d84347cfeff54fc2b", "code_name": "separation_and_affection", "code_color": "hsl(299 68% 52%)", "document_path": "corpus/1775-june-15-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I sat down to write to you on Monday, but really could not compose myself sufficiently; the anxiety I suffered from not hearing one syllable from you for more than five weeks, and the new distress arising from the arrival of recruits, agitated me more than I have been since the never-to-be-forgotten 14th of April. I have been much revived by receiving two letters from you last night; one by the servant of your friend, and the other by the gentlemen you mention, though they both went to Cambridge, and I have not seen them. I hope to send this as a return to you.\n\nI feared much for your health, when you went away. I must entreat you to be as careful as you can consistently with the duty you owe your country. That consideration, alone, prevailed with me to consent to your departure in a time so perilous and so hazardous to your family, and with a body so infirm as to require the tenderest care and nursing. I wish you may be supported and divinely assisted in this most important crisis, when the fate of empire depends upon your wisdom and conduct. I greatly rejoice to hear of your union and determination to stand by us.\n"}, {"annotation_id": "dbd6c3b5dba94acf97e27dc05561752c", "code_id": "86e7daed85cf445d84347cfeff54fc2b", "code_name": "separation_and_affection", "code_color": "hsl(299 68% 52%)", "document_path": "corpus/1776-june-03-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "I received by Mr. Church a few lines from you. I wish to hear from you every opportunity, though you say no more than that you are well. I feel concerned lest your clothes should go to rags, having nobody to take any care of you in your long absence; and then, you have not with you a proper change for the seasons. However, you must do the best you can. I have a suit of homespun for you whenever you return. I cannot avoid sometimes repining that the gifts of fortune were not bestowed upon us, that I might have enjoyed the happiness of spending my days with my partner, but as it is, I think it my duty to attend with frugality and economy to our own private affairs; and if I cannot add to our little substance, yet see it that it is not diminished. I should enjoy but little comfort in a state of idleness and uselessness. Here I can serve my partner, my family, and myself, and enjoy the satisfaction of your serving your country.\n"}, {"annotation_id": "b35970e397324a87822244d1e9d8c916", "code_id": "55b8d127cd43465d8d116cffa0aaa569", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1775-june-22-abigail-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "You inquire of me who were at the engagement at Grape Island. I may say, with truth, all of Weymouth, Braintree, Hingham, who were able to bear arms, and hundreds from other towns within twenty, thirty, and forty miles of Weymouth. Our good friend, the Dr., is in a miserable state of health, and hardly able to go from his own house to my father's. Danger, you know, sometimes makes timid men bold. He stood that day very well, and generously attended, with drink, biscuit, flints, etc., five hundred men, without taking any pay. He has since been chosen one of the committee of correspondence for that town, and has done much service by establishing a regular method of alarm from town to town. Both your brothers were there; your younger brother, with his company, who gained honor by their good order that day. He was one of the first to venture on board a schooner to land upon the island. As to Chelsea, I cannot be so particular, as I know only in general that Colonel Putnam commanded there, and had many gentlemen volunteers. We have two companies stationed in this town: at Germantown, Captain Turner; at Squantum, Captain Vinton; in Weymouth, one; in Hingham, two, etc. I believe I shall remove your books this week to your brother's. We think it advisable. Colonel Quincy has procured his family a retreat at Deacon Holbrook's. Mr. Cranch has one at Major Bass's, in case of necessity, to which we hope not to be driven. We hear that the troops destined for New York are all expected here; but we have got to that pass that a whole legion of them would not intimidate us. I think I am very brave, upon the whole. If danger comes near my dwelling, I suppose I shall shudder. We want powder, but, with the blessing of Heaven, we fear them not. Write every opportunity you can. I am, yours,\n"}, {"annotation_id": "ca432e580bf544baa75c5e452e3eee01", "code_id": "55b8d127cd43465d8d116cffa0aaa569", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1776-july-03-john-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "Had a Declaration of Independency been made seven months ago, it would have been attended with many great and glorious effects. We might, before this hour, have formed alliances with foreign states. We should have mastered Quebec, and been in possession of Canada. You will perhaps wonder how such a declaration would have influenced our affairs in Canada, but if I could write with freedom, I could easily convince you that it would, and explain to you the manner how. Many gentlemen in high stations, and of great influence, have been duped by the ministerial bubble of Commissioners to treat. And in real, sincere expectation of this event, which they so fondly wished, they have been slow and languid in promoting measures for the reduction of that province. Others there are in the Colonies who really wished that our enterprise in Canada would be defeated, that the Colonies might be brought into danger and distress between two fires, and be thus induced to submit. Others really wished to defeat the expedition to Canada, lest the conquest of it should elevate the minds of the people too much to hearken to those terms of reconciliation which, they believed, would be offered us. These jarring views, wishes, and designs occasioned an opposition to many salutary measures which were proposed for the support of that expedition, and caused obstructions, embarrassments, and studied delays, which have finally lost us the province.\n\nAll these causes, however, in conjunction would not have disappointed us, if it had not been for a misfortune which could not be foreseen, and perhaps could not have been prevented; I mean the prevalence of the small-pox among our troops. This fatal pestilence completed our destruction. It is a frown of Providence upon us, which we ought to lay to heart.\n"}, {"annotation_id": "e3be6ae23245417d92d8d337ffabbf9a", "code_id": "55b8d127cd43465d8d116cffa0aaa569", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1776-march-02-abigail-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 11, "anchor_status": "clean", "memo": null, "exact_text": "I have been kept in a continual state of anxiety and expectation ever since you left me. It has been said \"to-morrow\" and \"to-morrow,\" for this month, but when the dreadful to-morrow will be, I know not. But hark! The house this instant shakes with the roar of cannon. I have been to the door, and find it is a cannonade from our army. Orders, I find, are come for all the remaining militia to repair to the lines Monday night by twelve o'clock. No sleep for me to-night. And if I cannot, who have no guilt upon my soul with regard to this cause, how shall the miserable wretches who have been the procurers of this dreadful scene, and those who are to be the actors, lie down with the load of guilt upon their souls?\n"}, {"annotation_id": "d4e14c2e601646dcbf34d17209d7f023", "code_id": "55b8d127cd43465d8d116cffa0aaa569", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1776-march-02-abigail-adams.txt", "scope_type": "span", "start_line": 21, "end_line": 21, "anchor_status": "clean", "memo": null, "exact_text": "I have just returned from Penn's hill, where I have been sitting to hear the amazing roar of cannon, and from whence I could see every shell which was thrown. The sound, I think, is one of the grandest in nature, and is of the true species of the sublime. 'T is now an incessant roar; but oh! the fatal ideas which are connected with the sound! How many of our dear countrymen must fall!\n"}], "document_texts": {"corpus/1776-july-13-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Boston, 13 July, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: Boston, 13 July, 1776", "Source letter number: 120", "", "I must begin with apologizing to you for not writing since the 17th of June. I have really had so many cares upon my hands and mind, with a bad inflammation in my eyes, that I have not been able to write. I now date from Boston, where I yesterday arrived and was with all of our little ones inoculated for the small-pox....", "", "As to news, we have taken several prizes since I wrote you, as you will see by the newspapers. The present report is of Lord Howe's coming with unlimited powers. However, suppose it is so, I believe he little thinks of treating with us as Independent States. How can any person yet dream of a settlement, accommodations, etc.? They have neither the spirit nor the feeling of men. Yet I see some who never were called Tories gratified with the idea of Lord Howe's being upon his passage with such powers!", "", "Sunday, 14 July.", "", "By yesterday's post I received two letters dated 3d and 4th of July, and though your letters never fail to give me pleasure, be the subject what it will, yet it was greatly heightened by the prospect of the future happiness and glory of our country. Nor am I a little gratified when I reflect that a person so nearly connected with me has had the honor of being a principal actor in laying a foundation for its future greatness.", "", "May the foundation of our new Constitution be Justice, Truth, Righteousness! Like the wise man's house, may it be founded upon these rocks, and then neither storms nor tempests will overthrow it!", "", "I cannot but be sorry that some of the most manly sentiments in the Declaration are expunged from the printed copy. Perhaps wise reasons induced it.", "", "I shall write you now very often. Pray inform me constantly of every important action. Every expression of tenderness is a cordial to my heart. Important as they are to the rest of the world, to me they are _everything_.", "", "I suppose you have heard of a fleet which came up pretty near the Light and kept us all with our mouths open, ready to catch them, but after staying near a week, and making what observations they could, set sail and went off, to our great mortification, who were ---- for them in every respect. If our ship of thirty-two guns which was built at Portsmouth, and waiting only for guns, and another at Plymouth in the same state, had been in readiness, we should in all probability have been masters of them. Where the blame lies in that respect, I know not. 'T is laid upon Congress, and Congress is also blamed for not appointing us a General. But Rome was not built in a day.", "", "All our friends desire to be remembered to you, and foremost in that number stands your", "", "PORTIA."], "corpus/1776-june-03-abigail-adams.txt": ["Title: Abigail Adams to John Adams, 3 June, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: 3 June, 1776", "Source letter number: 110", "", "I received by Mr. Church a few lines from you. I wish to hear from you every opportunity, though you say no more than that you are well. I feel concerned lest your clothes should go to rags, having nobody to take any care of you in your long absence; and then, you have not with you a proper change for the seasons. However, you must do the best you can. I have a suit of homespun for you whenever you return. I cannot avoid sometimes repining that the gifts of fortune were not bestowed upon us, that I might have enjoyed the happiness of spending my days with my partner, but as it is, I think it my duty to attend with frugality and economy to our own private affairs; and if I cannot add to our little substance, yet see it that it is not diminished. I should enjoy but little comfort in a state of idleness and uselessness. Here I can serve my partner, my family, and myself, and enjoy the satisfaction of your serving your country.", "", "I wish you would write me what I had best do with our house at Boston. I would advertise it if you think best. There are so many houses torn to pieces and so many others abused, that I might stand a chance of letting it, perhaps, as it is in so good repair.", "", "My brother is desirous of joining the army again, but would choose to be a field-officer. I have mentioned him to some of the House, and suppose he will be recommended to Congress for a commission. I hardly know where you will find men to form the regiments required. I begin to think population a very important branch in the American manufactories.", "", "I inclose a list of the Council. The House consists of more than two hundred and fifty members. Your former pupil Angier comes from Bridgewater, and five others. I hope they will proceed in business with a little more spirit than heretofore. They are procuring two row-galleys, but when they will be finished I know not. I thought they were near done, but find to-day they are not yet contracted for. All our gentry are gone from Nantasket Road except the _Commodore_ and one or two small craft.", "", "Everything bears a very great price. The merchant complains of the farmer and the farmer of the merchant--both are extravagant. Living is double what it was one year ago.", "", "I find you have licensed tea, but I am determined not to be a purchaser unless I can have it at Congress price, and in that article the venders pay no regard to Congress, asking ten, eight, and the lowest is seven and sixpence per pound. I should like a little green, but they say there is none to be had here. I only wish it for a medicine, as a relief to a nervous pain in my head to which I am sometimes subject. Were it as plenty as ever, I would not practice the use of it.", "", "Our family are all well. It has been reported here that Congress were going to remove forty miles beyond Philadelphia. I gave no credit to the report. I heard no reason assigned for it. I had much rather they would come a hundred miles nearer here. Adieu. Yours."], "corpus/1775-august-10-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 10 August, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 10 August, 1775", "Source letter number: 58", "", "Dearest Friend,--'T is with a sad heart I take my pen to write to you, because I must be the bearer of what will greatly afflict and distress you. Yet I wish you to be prepared for the event. Your brother Elihu lies very dangerously sick with a dysentery. He has been very bad for more than a week. His life is despaired of. Ere I close this letter, I fear I shall write you that he is no more.", "", "We are all in great distress. Your father is with him in great anguish. I hear this morning that he is sensible of his danger, and calmly resigned to the will of Heaven, which is a great satisfaction to his mourning friends. I cannot write more at present than to assure you of the health of your own family. Mr. Elisha Niles was very bad with the same disorder.", "", "11 August.", "", "I have this morning occasion to sing of mercies and judgments. May I properly notice each. A mixture of joy and grief agitates my bosom. The return of thee, my dear partner, after a four months' absence, is a pleasure I cannot express; but the joy is overclouded, and the day is darkened, by the mixture of grief,--the sympathy I feel for the loss of your brother, cut off in the pride of life and the bloom of manhood, in the midst of his usefulness. Heaven sanctify this affliction to us, and make me properly thankful that it is not my sad lot to mourn the loss of a husband in the room of a brother.", "", "May thy life be spared and thy health confirmed for the benefit of thy country and the happiness of thy family, is the constant supplication of thy friend."], "corpus/1776-july-03-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 3 July, 1776", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 3 July, 1776", "Source letter number: 115", "", "Had a Declaration of Independency been made seven months ago, it would have been attended with many great and glorious effects. We might, before this hour, have formed alliances with foreign states. We should have mastered Quebec, and been in possession of Canada. You will perhaps wonder how such a declaration would have influenced our affairs in Canada, but if I could write with freedom, I could easily convince you that it would, and explain to you the manner how. Many gentlemen in high stations, and of great influence, have been duped by the ministerial bubble of Commissioners to treat. And in real, sincere expectation of this event, which they so fondly wished, they have been slow and languid in promoting measures for the reduction of that province. Others there are in the Colonies who really wished that our enterprise in Canada would be defeated, that the Colonies might be brought into danger and distress between two fires, and be thus induced to submit. Others really wished to defeat the expedition to Canada, lest the conquest of it should elevate the minds of the people too much to hearken to those terms of reconciliation which, they believed, would be offered us. These jarring views, wishes, and designs occasioned an opposition to many salutary measures which were proposed for the support of that expedition, and caused obstructions, embarrassments, and studied delays, which have finally lost us the province.", "", "All these causes, however, in conjunction would not have disappointed us, if it had not been for a misfortune which could not be foreseen, and perhaps could not have been prevented; I mean the prevalence of the small-pox among our troops. This fatal pestilence completed our destruction. It is a frown of Providence upon us, which we ought to lay to heart.", "", "But, on the other hand, the delay of this Declaration to this time has many great advantages attending it. The hopes of reconciliation which were fondly entertained by multitudes of honest and well-meaning, though weak and mistaken people, have been gradually, and at last totally extinguished. Time has been given for the whole people maturely to consider the great question of independence, and to ripen their judgment, dissipate their fears, and allure their hopes, by discussing it in newspapers and pamphlets, by debating it in assemblies, conventions, committees of safety and inspection, in town and county meetings, as well as in private conversations, so that the whole people, in every colony of the thirteen, have now adopted it as their own act. This will cement the union, and avoid those heats, and perhaps convulsions, which might have been occasioned by such a Declaration six months ago.", "", "But the day is past. The second day of July, 1776, will be the most memorable epocha in the history of America. I am apt to believe that it will be celebrated by succeeding generations as the great anniversary festival.", "", "It ought to be commemorated as the day of deliverance, by solemn acts of devotion to God Almighty. It ought to be solemnized with pomp and parade, with shows, games, sports, guns, bells, bonfires, and illuminations, from one end of this continent to the other, from this time forward forevermore.", "", "You will think me transported with enthusiasm, but I am not. I am well aware of the toil and blood and treasure that it will cost us to maintain this Declaration and support and defend these States. Yet, through all the gloom, I can see the rays of ravishing light and glory. I can see that the end is more than worth all the means. And that posterity will triumph in that day's transaction, even although we should rue it, which I trust in God we shall not."], "corpus/1776-march-31-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 31 March, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 31 March, 1776", "Source letter number: 91", "", "I wish you would ever write me a letter half as long as I write you, and tell me, if you may, where your fleet are gone; what sort of defense Virginia can make against our common enemy; whether it is so situated as to make an able defense. Are not the gentry lords, and the common people vassals? Are they not like the uncivilized vassals Britain represents us to be? I hope their riflemen, who have shown themselves very savage and even blood-thirsty, are not a specimen of the generality of the people. I am willing to allow the colony great merit for having produced a Washington; but they have been shamefully duped by a Dunmore.", "", "I have sometimes been ready to think that the passion for liberty cannot be equally strong in the breasts of those who have been accustomed to deprive their fellow-creatures of theirs. Of this I am certain, that it is not founded upon that generous and Christian principle of doing to others as we would that others should do unto us.", "", "Do not you want to see Boston? I am fearful of the small-pox, or I should have been in before this time. I got Mr. Crane to go to our house and see what state it was in. I find it has been occupied by one of the doctors of a regiment; very dirty, but no other damage has been done to it. The few things which were left in it are all gone. I look upon it as a new acquisition of property--a property which one month ago I did not value at a single shilling, and would with pleasure have seen it in flames.", "", "The town in general is left in a better state than we expected; more owing to a precipitate flight than any regard to the inhabitants; though some individuals discovered a sense of honor and justice, and have left the rent of the houses in which they were, for the owners, and the furniture unhurt, or, if damaged, sufficient to make it good. Others have committed abominable ravages. The mansion-house of your President is safe, and the furniture unhurt; while the house and furniture of the Solicitor General have fallen a prey to their own merciless party. Surely the very fiends feel a reverential awe for virtue and patriotism, whilst they detest the parricide and traitor.", "", "I feel very differently at the approach of spring from what I did a month ago. We knew not then whether we could plant or sow with safety, whether where we had tilled we could reap the fruits of our own industry, whether we could rest in our own cottages or whether we should be driven from the seacoast to seek shelter in the wilderness; but now we feel a temporary peace, and the poor fugitives are returning to their deserted habitations.", "", "Though we felicitate ourselves, we sympathize with those who are trembling lest the lot of Boston should be theirs. But they cannot be in similar circumstances unless pusillanimity and cowardice should take possession of them. They have time and warning given them to see the evil and shun it.", "", "I long to hear that you have declared an independency. And, by the way, in the new code of laws which I suppose it will be necessary for you to make, I desire you would remember the ladies and be more generous and favorable to them than your ancestors. Do not put such unlimited power into the hands of the husbands. Remember, all men would be tyrants if they could. If particular care and attention is not paid to the ladies, we are determined to foment a rebellion, and will not hold ourselves bound by any laws in which we have no voice or representation.", "", "That your sex are naturally tyrannical is a truth so thoroughly established as to admit of no dispute; but such of you as wish to be happy willingly give up the harsh title of master for the more tender and endearing one of friend. Why, then, not put it out of the power of the vicious and the lawless to use us with cruelty and indignity with impunity? Men of sense in all ages abhor those customs which treat us only as the vassals of your sex; regard us then as beings placed by Providence under your protection, and in imitation of the Supreme Being make use of that power only for our happiness.", "", "April 5.", "", "I want to hear much oftener from you than I do. March 8th was the last date of any that I have yet had. You inquire of me whether I am making saltpetre. I have not yet attempted it, but after soap-making believe I shall make the experiment. I find as much as I can do to manufacture clothing for my family, which would else be naked. I know of but one person in this part of the town who has made any. That is Mr. Tertius Bass, as he is called, who has got very near a hundred-weight which has been found to be very good. I have heard of some others in the other parishes. Mr. Reed, of Weymouth, has been applied to, to go to Andover to the mills which are now at work, and he has gone.", "", "I have lately seen a small manuscript describing the proportions of the various sorts of powder fit for cannon, small-arms, and pistols. If it would be of any service your way I will get it transcribed and send it to you. Every one of your friends sends regards, and all the little ones. Adieu."], "corpus/1775-june-22-abigail-adams.txt": ["Title: Abigail Adams to John Adams, 22 June, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: 22 June, 1775", "Source letter number: 46", "", "I received yours of June 10th, for which I thank you. I want you to be more particular. Does every member feel for us? Can they realize what we suffer? And can they believe with what patience and fortitude we endure the conflict? Nor do we even tremble at the frowns of power.", "", "You inquire of me who were at the engagement at Grape Island. I may say, with truth, all of Weymouth, Braintree, Hingham, who were able to bear arms, and hundreds from other towns within twenty, thirty, and forty miles of Weymouth. Our good friend, the Dr., is in a miserable state of health, and hardly able to go from his own house to my father's. Danger, you know, sometimes makes timid men bold. He stood that day very well, and generously attended, with drink, biscuit, flints, etc., five hundred men, without taking any pay. He has since been chosen one of the committee of correspondence for that town, and has done much service by establishing a regular method of alarm from town to town. Both your brothers were there; your younger brother, with his company, who gained honor by their good order that day. He was one of the first to venture on board a schooner to land upon the island. As to Chelsea, I cannot be so particular, as I know only in general that Colonel Putnam commanded there, and had many gentlemen volunteers. We have two companies stationed in this town: at Germantown, Captain Turner; at Squantum, Captain Vinton; in Weymouth, one; in Hingham, two, etc. I believe I shall remove your books this week to your brother's. We think it advisable. Colonel Quincy has procured his family a retreat at Deacon Holbrook's. Mr. Cranch has one at Major Bass's, in case of necessity, to which we hope not to be driven. We hear that the troops destined for New York are all expected here; but we have got to that pass that a whole legion of them would not intimidate us. I think I am very brave, upon the whole. If danger comes near my dwelling, I suppose I shall shudder. We want powder, but, with the blessing of Heaven, we fear them not. Write every opportunity you can. I am, yours,", "", "PORTIA."], "corpus/1776-march-02-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Saturday Evening, 2 March, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: Saturday Evening, 2 March, 1776", "Source letter number: 86", "", "I was greatly rejoiced at the return of your servant, to find you had safely arrived, and that you were well. I had never heard a word from you after you had left New York, and a most ridiculous story had been industriously propagated in this and the neighboring towns to injure the cause and blast your reputation; namely, that you and your President had gone on board of a man-of-war from New York, and sailed for England. I should not mention so idle a report, but that it had given uneasiness to some of your friends; not that they in the least credited the report, but because the gaping vulgar swallowed the story. One man had deserted them and proved a traitor, another might, etc. I assure you, such high disputes took place in the public-house of this parish, that some men were collared and dragged out of the shop with great threats, for reporting such scandalous lies, and an uncle of ours offered his life as a forfeit for you, if the report proved true. However, it has been a nine days' marvel, and will now cease. I heartily wish every Tory was extirpated from America; they are continually, by secret means, undermining and injuring our cause.", "", "I am charmed with the sentiments of \"Common Sense,\" and wonder how an honest heart, one who wishes the welfare of his country and the happiness of posterity, can hesitate one moment at adopting them. I want to know how these sentiments are received in Congress. I dare say there would be no difficulty in procuring a vote and instructions from all the Assemblies in New England for Independency. I most sincerely wish that now, in the lucky moment, it might be done.", "", "I have been kept in a continual state of anxiety and expectation ever since you left me. It has been said \"to-morrow\" and \"to-morrow,\" for this month, but when the dreadful to-morrow will be, I know not. But hark! The house this instant shakes with the roar of cannon. I have been to the door, and find it is a cannonade from our army. Orders, I find, are come for all the remaining militia to repair to the lines Monday night by twelve o'clock. No sleep for me to-night. And if I cannot, who have no guilt upon my soul with regard to this cause, how shall the miserable wretches who have been the procurers of this dreadful scene, and those who are to be the actors, lie down with the load of guilt upon their souls?", "", "Sunday Evening, 3 March.", "", "I went to bed after twelve, but got no rest; the cannon continued firing, and my heart beat pace with them all night. We have had a pretty quiet day, but what to-morrow will bring forth, God only knows.", "", "Monday Evening.", "", "Tolerably quiet. To-day the militia have all mustered, with three days' provision, and are all marched by three o'clock this afternoon, though their notice was no longer ago than eight o'clock, Saturday. And now we have scarcely a man, but our regular guards, either in Weymouth, Hingham, Braintree, or Milton, and the militia from the more remote towns are called in as seacoast guards. Can you form to yourself an idea of our sensations?", "", "I have just returned from Penn's hill, where I have been sitting to hear the amazing roar of cannon, and from whence I could see every shell which was thrown. The sound, I think, is one of the grandest in nature, and is of the true species of the sublime. 'T is now an incessant roar; but oh! the fatal ideas which are connected with the sound! How many of our dear countrymen must fall!", "", "Tuesday Morning.", "", "I went to bed about twelve, and rose again a little after one. I could no more sleep than if I had been in the engagement; the rattling of the windows, the jar of the house, the continual roar of twenty-four pounders, and the bursting of shells, give us such ideas, and realize a scene to us of which we could form scarcely any conception. About six, this morning, there was quiet. I rejoiced in a few hours' calm. I hear we got possession of Dorchester Hill last night; four thousand men upon it to-day; lost but one man. The ships are all drawn round the town. To-night we shall realize a more terrible scene still. I sometimes think I cannot stand it. I wish myself with you, out of hearing, as I cannot assist them. I hope to give you joy of Boston, even if it is in ruins, before I send this away. I am too much agitated to write as I ought, and languid for want of rest.", "", "Thursday, Fast-day.", "", "All my anxiety and distress is at present at an end. I feel disappointed. This day our militia are all returning, without effecting anything more than taking possession of Dorchester Hill. I hope it is wise and just, but, from all the muster and stir, I hoped and expected more important and decisive scenes. I would not have suffered all I have for two such hills. Ever since the taking of that, we have had a perfect calm; nor can I learn yet what effect it has had in Boston. I do not hear of one person's escaping since.", "", "I was very much pleased with your choice of a committee for Canada. All those to whom I have ventured to show that part of your letter, approve the scheme of the priest as a master-stroke of policy. I feel sorry that General Lee has left us, but his presence at New York was no doubt of great importance, as we have reason to think it prevented Clinton from landing and gathering together such a nest of vermin as would at least have distressed us greatly. But how can you spare him from here? Can you make his place good? Can you supply it with a man equally qualified to save us? How do the Virginians relish the troops said to be destined for them? Are they putting themselves into a state of defense? I inclose to you a copy of a letter sent by Captain Furnance, who is in Mr. Ned Church's employ, and who came into the Cape about ten days ago. You will learn the sentiments of our cousin by it. Some of which may be true, but I hope he is a much better divine than politician. I hear that in one of his letters he mentions certain intercepted letters which he says have made much noise in England, and laments that you ever wrote them. I cannot bear to think of your continuing in a state of supineness this winter.", "", "\"There is a tide in the affairs of men, Which, taken at the flood, leads on to fortune; Omitted, all the voyage of their life Is bound in shallows and in miseries. On such a full sea are we now afloat; And we must take the current when it serves, Or lose our ventures.\"", "", "Sunday Evening, 10 March.", "", "I had scarcely finished these lines when my ears were again assaulted by the roar of cannon. I could not write any further. My hand and heart will tremble at this \"domestic fury and fierce civil strife,\" which \"cumber all\" our \"parts;\" though \"blood and destruction\" are \"so much in use,\" \"and dreadful objects so familiar,\" yet is not \"pity choked,\" nor my heart grown callous. I feel for the unhappy wretches who know not where to fly for safety. I feel still more for my bleeding countrymen, who are hazarding their lives and their limbs. A most terrible and incessant cannonade from half after eight till six this morning. I hear we lost four men killed, and some wounded, in attempting to take the hill nearest the town, called Nook's Hill. We did some work, but the fire from the ships beat off our men, so that they did not secure it, but retired to the fort upon the other hill.", "", "I have not got all the particulars; I wish I had; but, as I have an opportunity of sending this, I shall endeavor to be more particular in my next.", "", "If there are reinforcements here, I believe we shall be driven from the seacoast; but, in whatever state I am, I will endeavor to be therewith content.", "", "\"Man wants but little here below, Nor wants that little long.\"", "", "You will excuse this very incorrect letter. You see in what perturbation it has been written, and how many times I have left off. Adieu.", "", "Yours.", "", "P. S. Took's grammar is the one you mention."], "corpus/1775-december-10-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 10 December, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 10 December, 1775", "Source letter number: 81", "", "I received your obliging favor by Mrs. Morgan, with the papers and the other articles you sent, which were very acceptable to me, as they are not to be purchased here. I shall be very choice of them.", "", "I have, according to your desire, been upon a visit to Mrs. Morgan, who keeps at Major Mifflin's. I had received a message from Mrs. Mifflin some time ago, desiring I would visit her. My father, who, you know, is very obliging in this way, accompanied me, and I had the pleasure of drinking coffee with the Doctor and his lady, the Major and his lady, and a Mr. and Mrs. Smith from New York, a daughter of the famous son of liberty, Captain Sears; Generals Gates and Lee; a Dr. M'Henry and a Mr. Elwyn, with many others who were strangers to me. I was very politely entertained, and noticed by the generals; more especially General Lee, who was very urgent with me to tarry in town, and dine with him and the ladies present, at Hobgoblin Hall, but I excused myself. The General was determined that I should not only be acquainted with him, but with his companions too, and therefore placed a chair before me, into which he ordered Mr. Spada to mount and present his paw to me for a better acquaintance. I could not do otherwise than accept it. \"That, Madam,\" says he, \"is the dog which Mr. ---- has rendered famous.\"", "", "I was so little while in company with these persons, and the company so mixed, that it was almost impossible to form any judgment of them. The Doctor appeared modest, and his lady affable and agreeable. Major Mifflin, you know, I was always an admirer of, as well as of his delicate lady. I believe Philadelphia must be an unfertile soil, or it would not produce so many unfruitful women. I always conceive of these persons as wanting one addition to their happiness; but in these perilous times, I know not whether it ought to be considered as an infelicity, since they are certainly freed from the anxiety every parent must feel for their rising offspring.", "", "I drank coffee one day with General Sullivan upon Winter Hill. He appears to be a man of sense and spirit. His countenance denotes him of a warm constitution, not to be very suddenly moved, but, when once roused, not very easily lulled,--easy and social,--well calculated for a military station, as he seems to be possessed of those popular qualities necessary to attach men to him.", "", "By the way, I congratulate you upon our late noble acquisition of military stores. It is a most grand mortar, I assure you. Surely Heaven smiles upon us, in many respects, and we have continually to speak of mercies, as well as of judgments. I wish our gratitude may be anywise proportionate to our benefits. I suppose, in Congress, you think of everything relative to trade and commerce, as well as other things; but, as I have been desired to mention to you some things, I shall not omit them. One is, that there may be something done, in a Continental way, with regard to excise upon spirituous liquors, that each of the New England colonies may be upon the same footing; whereas we formerly used to pay an excise, and the other colonies none, or very little, by which means they drew away our trade. An excise is necessary, though it may be objected to by the mercantile interest, as a too frequent use of spirits endangers the well-being of society. Another article is, that some method may be devised to keep among us our gold and silver, which are now every day shipped off to the West Indies for molasses, coffee, and sugar; and this I can say of my own knowledge, that a dollar in silver is now become a great rarity, and our traders will give you a hundred pounds of paper for ninety of silver, or nearly that proportion. If any trade is allowed to the West Indies, would it not be better to carry some commodity of our own produce in exchange? Medicines, cotton-wool, and some other articles, we are in great want of. Formerly we used to purchase cotton-wool at one shilling, lawful money, per bag; now it is three, and the scarcity of that article distresses us, as it was wrought up with less trouble than any other article of clothing. Flax is now from a shilling to one and sixpence per pound, sheep's wool eighteenpence, and linens not to be had at any price. I cannot mention the article in the English goods way which is not double; and in the West India molasses by retail I used formerly to purchase at one and eightpence, now it is two and eightpence; rum, three shillings; coffee, one and threepence, and all other things in proportion. Corn is four shillings per bushel; rye, five; oats, three and eightpence; hay, five and six shillings per hundred; wood, twenty shillings per cord; but meat of all kinds cheap.", "", "My uncle Quincy desires to be remembered to you; he inquired when you talked of coming home. I told him you had not fixed any time. He says, if you don't come soon, he would advise me to procure another husband. He, of all persons, ought not to give me such advice, I told him, unless he set a better example himself.", "", "Be kind enough to burn this letter. It is written in great haste, and a most incorrect scrawl it is. But I cannot conclude without telling you we are all very angry with your House of Assembly for their instructions. They raise prejudices in the minds of people, and serve to create in their minds a terror at a separation from a people wholly unworthy of us. We are a little of the spaniel kind; though so often spurned, still to fawn argues a meanness of spirit, that, as an individual, I disclaim, and would rather endure any hardship than submit to it.", "", "Yours."], "corpus/1775-june-15-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Weymouth, 15 June, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Weymouth, 15 June, 1775", "Source letter number: 42", "", "I sat down to write to you on Monday, but really could not compose myself sufficiently; the anxiety I suffered from not hearing one syllable from you for more than five weeks, and the new distress arising from the arrival of recruits, agitated me more than I have been since the never-to-be-forgotten 14th of April. I have been much revived by receiving two letters from you last night; one by the servant of your friend, and the other by the gentlemen you mention, though they both went to Cambridge, and I have not seen them. I hope to send this as a return to you.", "", "I feared much for your health, when you went away. I must entreat you to be as careful as you can consistently with the duty you owe your country. That consideration, alone, prevailed with me to consent to your departure in a time so perilous and so hazardous to your family, and with a body so infirm as to require the tenderest care and nursing. I wish you may be supported and divinely assisted in this most important crisis, when the fate of empire depends upon your wisdom and conduct. I greatly rejoice to hear of your union and determination to stand by us.", "", "We cannot but consider the great distance you are from us as a very great misfortune, when our critical situation renders it necessary to hear from you every week, and will be more and more so, as difficulties arise. We now expect our seacoast ravaged; perhaps the very next letter I write will inform you that I am driven away from our yet quiet cottage. Necessity will oblige Gage to take some desperate steps. We are told for truth that he is now eight thousand strong. We live in continual expectation of alarms. Courage I know we have in abundance; conduct I hope we shall not want; but powder,--where shall we get a sufficient supply? I wish we may not fail there. Every town is filled with the distressed inhabitants of Boston. Our house among others is deserted, and by this time, like enough, made use of as a barrack. Mr. Bowdoin and his lady are at present in the house of Mrs. Borland, and are going to Middleborough, to the house of Judge Oliver. He, poor gentleman, is so low that I apprehend he is hastening to a house not made with hands; he looks like a mere skeleton, speaks faint and low, is racked with a violent cough, and, I think, far advanced in a consumption. I went to see him last Saturday. He is very inquisitive of every person with regard to the times; begged I would let him know of the first intelligence I had from you; is very unable to converse by reason of his cough. He rides every pleasant day, and has been kind enough to call at the door (though unable to get out) several times. He says the very name of Hutchinson distresses him. Speaking of him, the other day, he broke out, \"Religious rascal! how I abhor his name!\"", "", "Pray be as particular as possible when you write. Everybody wants to hear and to know what is doing, and what may be communicated do not fail to inform me of. All our friends desire to be kindly remembered to you. Gage's proclamation you will receive by this conveyance. All the records of time cannot produce a blacker page. Satan, when driven from the regions of bliss, exhibited not more malice. Surely the father of lies is superseded. Yet we think it the best proclamation he could have issued.", "", "I shall, whenever I can, receive and entertain, in the best manner I am capable, the gentlemen who have so generously proffered their services in our army. Government is wanted in the army and elsewhere. We see the want of it more from so large a body being together, than when each individual was employed in his own domestic circle. My best regards attend every man you esteem. You will make my compliments to Mr. Mifflin and lady. I do not now wonder at the regard the ladies express for a soldier. Every man who wears a cockade appears of double the importance he used to do, and I feel a respect for the lowest subaltern in the army. You tell me you know not when you shall see me. I never trust myself long with the terrors which sometimes intrude themselves upon me.", "", "I hope we shall see each other again, and rejoice together in happier days; the little ones are well, and send duty to papa. Don't fail of letting me hear from you by every opportunity. Every line is like a precious relic of the saints.", "", "I have a request to make of you; something like the barrel of sand, I suppose you will think it, but really of much more importance to me. It is, that you would send out Mr. Bass, and purchase me a bundle of pins and put them in your trunk for me. The cry for pins is so great that what I used to buy for seven shillings and sixpence are now twenty shillings, and not to be had for that. A bundle contains six thousand, for which I used to give a dollar; but if you can procure them for fifty shillings, or three pounds, pray let me have them.", "", "I am, with the tenderest regard,", "", "Your", "", "PORTIA."], "corpus/1775-june-11-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 11 June, 1775", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 11 June, 1775", "Source letter number: 43", "", "I have been this morning to hear Mr. Duffield, a preacher in this city, whose principles, prayers, and sermons more nearly resemble those of our New England clergy than any that I have heard. His discourse was a kind of exposition on the thirty-fifth chapter of Isaiah. America was the wilderness, and the solitary place, and he said it would be glad, \"rejoice and blossom as the rose.\" He labored \"to strengthen the weak hands and confirm the feeble knees.\" He \"said to them that were of a fearful heart, Be strong, fear not. Behold, your God will come with vengeance, even God with a recompense; he will come and save you,\" \"No lion shall be there, nor any ravenous beast shall go up thereon, but the redeemed shall walk there,\" etc. He applied the whole prophecy to this country, and gave us as animating an entertainment as I ever heard. He filled and swelled the bosom of every hearer. I hope you have received a letter, in which I inclosed you a pastoral letter from the synod of New York and Philadelphia; by this you will see, that the clergy this way are but now beginning to engage in politics, and they engage with a fervor that will produce wonderful effects.", "", "17 June.", "", "I can now inform you that the Congress have made choice of the modest and virtuous, the amiable, generous, and brave George Washington, Esquire, to be General of the American army, and that he is to repair, as soon as possible, to the camp before Boston. This appointment will have a great effect in cementing and securing the union of these colonies. The continent is really in earnest, in defending the country. They have voted ten companies of riflemen to be sent from Pennsylvania, Maryland, and Virginia, to join the army before Boston. These are an excellent species of light infantry. They use a peculiar kind of musket, called a rifle. It has circular or ---- grooves within the barrel, and carries a ball with great exactness to great distances. They are the most accurate marksmen in the world.", "", "I begin to hope we shall not sit all summer. I hope the people of our province will treat the General with all that confidence and affection, that politeness and respect, which is due to one of the most important characters in the world. The liberties of America depend upon him, in a great degree. I have never been able to obtain from our province any regular and particular intelligence, since I left it. Kent, Swift, Tudor, Dr. Cooper, Dr. Winthrop, and others wrote me often last fall; not a line from them this time.", "", "I have found this Congress like the last. When we first came together, I found a strong jealousy of us from New England, and the Massachusetts in particular; suspicions entertained of designs of independency; an American republic; Presbyterian principles, and twenty other things. Our sentiments were heard in Congress with great caution, and seemed to make but little impression; but the longer we sat, the more clearly they saw the necessity of pushing vigorous measures. It has been so now. Every day we sit, the more we are convinced that the designs against us are hostile and sanguinary, and that nothing but fortitude, vigor, and perseverance can save us.", "", "But America is a great, unwieldy body. Its progress must be slow. It is like a large fleet sailing under convoy. The fleetest sailers must wait for the dullest and slowest. Like a coach and six, the swiftest horses must be slackened, and the slowest quickened, that all may keep an even pace.", "", "It is long since I heard from you. I fear you have been kept in continual alarms. My duty and love to all. My dear children, come here and kiss me. We have appointed a Continental fast. Millions will be upon their knees at once before their great Creator, imploring his forgiveness and blessing; his smiles on American councils and arms.", "", "My duty to your uncle Quincy; your papa, mamma, and mine; my brothers and sisters, and yours. Adieu."], "corpus/1775-april-30-john-adams.txt": ["Title: John Adams to Abigail Adams, Hartford, 30 April, 1775", "Author: John Adams", "Recipient: Abigail Adams", "Date: Hartford, 30 April, 1775", "Source letter number: 29", "", "New York has appointed an ample representation in our Congress, and has appointed a Provincial Congress. The people of the city have seized the city arms and ammunition out of the hands of the mayor, who is a creature of the Governor. Lord North will certainly be disappointed in his expectation of seducing New York. The Tories there durst not show their heads. The Jerseys are aroused, and greatly assist the friends of liberty in New York. North Carolina has done bravely; chosen the old delegates in Provincial Congress, and then confirmed the choice in General Assembly, in opposition to all that Governor Martin could do. The Assembly of this colony is now sitting at Hartford. We are treated with great tenderness, sympathy, friendship, and respect. Everything is doing by this colony that can be done by men, both for New York and Boston. Keep your spirits composed and calm, and don't suffer yourself to be disturbed by idle reports and frivolous alarms. We shall see better times yet. Lord North is insuring us success. I am wounded to the heart with the news, this moment told me, of Josiah Quincy's death."], "corpus/1775-october-23-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 23 October, 1775", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 23 October, 1775", "Source letter number: 72", "", "Yesterday yours of October 9th came to hand. Your letters never failed to give me pleasure. The greatest pleasure that I take is in receiving them. And although every one which has yet come to hand is replete with melancholy tidings, yet I can truly say I never was so earnest to receive them. I rejoice in the happy principles and the happy temper which apparently dictated them all.", "", "I feel myself much affected with the breach upon the family. But we can count a mother, a brother, an aunt, and a brother's child among the slain by this cruel pestilence. May God Almighty put a stop to
