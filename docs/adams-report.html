elay", "code_color": "hsl(194 68% 52%)", "document_path": "corpus/1775-may-04-abigail-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I want very much to hear from you, how you stood your journey, and in what state you find yourself now."}, {"annotation_id": "3f424f739b3648f69af5e85b0ec102f0", "code_id": "3f5b9e2fae1547b69524c5ed11b4a02e", "code_name": "information_and_delay", "code_color": "hsl(194 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 7, "end_line": 7, "anchor_status": "clean", "memo": null, "exact_text": "I wish you would ever write me a letter half as long as I write you, and tell me, if you may, where your fleet are gone; what sort of defense Virginia can make against our common enemy; whether it is so situated as to make an able defense."}, {"annotation_id": "5568019489734f8ca9c673b96de63a3c", "code_id": "d793213799cb498e8f0740da3ad11bba", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1775-december-10-abigail-adams.txt", "scope_type": "span", "start_line": 19, "end_line": 19, "anchor_status": "clean", "memo": null, "exact_text": "But I cannot conclude without telling you we are all very angry with your House of Assembly for their instructions."}, {"annotation_id": "b2221f99d44d408b92928a7693ba8914", "code_id": "d793213799cb498e8f0740da3ad11bba", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1776-april-14-john-adams.txt", "scope_type": "span", "start_line": 13, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "As to your extraordinary code of laws, I cannot but laugh."}, {"annotation_id": "36c15e85263d4c33b3de8a54cac4b107", "code_id": "d793213799cb498e8f0740da3ad11bba", "code_name": "political_voice", "code_color": "hsl(83 68% 52%)", "document_path": "corpus/1776-march-31-abigail-adams.txt", "scope_type": "span", "start_line": 19, "end_line": 19, "anchor_status": "clean", "memo": null, "exact_text": "And, by the way, in the new code of laws which I suppose it will be necessary for you to make, I desire you would remember the ladies and be more generous and favorable to them than your ancestors."}, {"annotation_id": "cb56123eef6b4d82b86902d66e0056ec", "code_id": "9691eb9976e54667a294f3ae1b6bf116", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1775-september-17-john-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 11, "anchor_status": "clean", "memo": null, "exact_text": "Henry is made a General in Virginia, and therefore could not come."}, {"annotation_id": "019c4153cb69462ea490d7a81bde8f8e", "code_id": "9691eb9976e54667a294f3ae1b6bf116", "code_name": "public_duty", "code_color": "hsl(132 68% 52%)", "document_path": "corpus/1776-july-03-john-adams.txt", "scope_type": "span", "start_line": 13, "end_line": 13, "anchor_status": "clean", "memo": null, "exact_text": "The second day of July, 1776, will be the most memorable epocha in the history of America."}, {"annotation_id": "5edbe3de104141d09966aaebf5793eff", "code_id": "0a778449f80d436ebdde6e05021dc8fb", "code_name": "separation_and_affection", "code_color": "hsl(299 68% 52%)", "document_path": "corpus/1775-may-04-abigail-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I felt very anxious about you; though I endeavored to be very insensible and heroic, yet my heart felt like a heart of lead."}, {"annotation_id": "e178fbf409854e5aa6ae7d4dd84a4415", "code_id": "0a778449f80d436ebdde6e05021dc8fb", "code_name": "separation_and_affection", "code_color": "hsl(299 68% 52%)", "document_path": "corpus/1775-september-17-john-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 11, "anchor_status": "clean", "memo": null, "exact_text": "Remember me in the tenderest language to all our little folks."}, {"annotation_id": "cf3a2e66a31b4731a04f2b4a3742c4cd", "code_id": "8f0162785ce5490d9e6529f6daead0a5", "code_name": "waiting_for_news", "code_color": "hsl(289 68% 52%)", "document_path": "corpus/1775-may-04-abigail-adams.txt", "scope_type": "span", "start_line": 9, "end_line": 9, "anchor_status": "clean", "memo": null, "exact_text": "I want very much to hear from you, how you stood your journey, and in what state you find yourself now. I felt very anxious about you; though I endeavored to be very insensible and heroic, yet my heart felt like a heart of lead."}, {"annotation_id": "5447e119bcb34c3cbfc4b4a82ffb0517", "code_id": "1073be30be174af28391b85106f194d6", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1775-june-15-abigail-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 11, "anchor_status": "clean", "memo": null, "exact_text": "We live in continual expectation of alarms."}, {"annotation_id": "ca98b3b3b4634c5fa5d05b8fb74c90e0", "code_id": "1073be30be174af28391b85106f194d6", "code_name": "war_and_danger", "code_color": "hsl(226 68% 52%)", "document_path": "corpus/1776-march-17-john-adams.txt", "scope_type": "span", "start_line": 11, "end_line": 11, "anchor_status": "clean", "memo": null, "exact_text": "By a vessel from Salem a cannonade was heard from dark till nine o'clock, last night was a week ago."}], "document_texts": {"corpus/1776-april-14-john-adams.txt": ["Title: John Adams to Abigail Adams, 14 April, 1776", "Author: John Adams", "Recipient: Abigail Adams", "Date: 14 April, 1776", "Source letter number: 94", "", "You justly complain of my short letters, but the critical state of things and the multiplicity of avocations must plead my excuse. You ask where the fleet is? The inclosed papers will inform you. You ask what sort of defense Virginia can make? I believe they will make an able defense. Their militia and minute-men have been some time employed in training themselves, and they have nine battalions of regulars, as they call them, maintained among them, under good officers, at the Continental expense. They have set up a number of manufactories of firearms, which are busily employed. They are tolerably supplied with powder, and are successful and assiduous in making saltpetre. Their neighboring sister, or rather daughter colony of North Carolina, which is a warlike colony, and has several battalions at the Continental expense, as well as a pretty good militia, are ready to assist them, and they are in very good spirits and seem determined to make a brave resistance. The gentry are very rich, and the common people very poor. This inequality of property gives an aristocratical turn to all their proceedings, and occasions a strong aversion in their patricians to \"Common Sense.\" But the spirit of these Barons is coming down, and it must submit. It is very true, as you observe, they have been duped by Dunmore. But this is a common case. All the colonies are duped, more or less, at one time and another. A more egregious bubble was never blown up than the story of Commissioners coming to treat with the Congress, yet it has gained credit like a charm, not only with, but against the clearest evidence. I never shall forget the delusion which seized our best and most sagacious friends, the dear inhabitants of Boston, the winter before last. Credulity and the want of foresight are imperfections in the human character, that no politician can sufficiently guard against.", "", "You give me some pleasure by your account of a certain house in Queen Street. I had burned it long ago in imagination. It rises now to my view like a phoenix. What shall I say of the Solicitor General? I pity his pretty children. I pity his father and his sisters. I wish I could be clear that it is no moral evil to pity him and his lady. Upon repentance, they will certainly have a large share in the compassions of many. But let us take warning, and give it to our children. Whenever vanity and gayety, a love of pomp and dress, furniture, equipage, buildings, great company, expensive diversions, and elegant entertainments get the better of the principles and judgments of men or women, there is no knowing where they will stop, nor into what evils, natural, moral, or political, they will lead us.", "", "Your description of your own _gaieté de coeur_ charms me. Thanks be to God, you have just cause to rejoice, and may the bright prospect be obscured by no cloud. As to declarations of independency, be patient. Read our privateering laws and our commercial laws. What signifies a word?", "", "As to your extraordinary code of laws, I cannot but laugh. We have been told that our struggle has loosened the bonds of government everywhere; that children and apprentices were disobedient; that schools and colleges were grown turbulent; that Indians slighted their guardians, and negroes grew insolent to their masters. But your letter was the first intimation that another tribe, more numerous and powerful than all the rest, were grown discontented. This is rather too coarse a compliment, but you are so saucy, I won't blot it out. Depend upon it, we know better than to repeal our masculine systems. Although they are in full force, you know they are little more than theory. We dare not exert our power in its full latitude. We are obliged to go fair and softly, and, in practice, you know we are the subjects. We have only the name of masters, and rather than give up this, which would completely subject us to the despotism of the petticoat, I hope General Washington and all our brave heroes would fight; I am sure every good politician would plot, as long as he would against despotism, empire, monarchy, aristocracy, oligarchy, or ochlocracy. A fine story, indeed! I begin to think the ministry as deep as they are wicked. After stirring up Tories, land-jobbers, trimmers, bigots, Canadians, Indians, negroes, Hanoverians, Hessians, Russians, Irish Roman Catholics, Scotch renegadoes, at last they have stimulated the ---- to demand new privileges and threaten to rebel."], "corpus/1775-june-15-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Weymouth, 15 June, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Weymouth, 15 June, 1775", "Source letter number: 42", "", "I sat down to write to you on Monday, but really could not compose myself sufficiently; the anxiety I suffered from not hearing one syllable from you for more than five weeks, and the new distress arising from the arrival of recruits, agitated me more than I have been since the never-to-be-forgotten 14th of April. I have been much revived by receiving two letters from you last night; one by the servant of your friend, and the other by the gentlemen you mention, though they both went to Cambridge, and I have not seen them. I hope to send this as a return to you.", "", "I feared much for your health, when you went away. I must entreat you to be as careful as you can consistently with the duty you owe your country. That consideration, alone, prevailed with me to consent to your departure in a time so perilous and so hazardous to your family, and with a body so infirm as to require the tenderest care and nursing. I wish you may be supported and divinely assisted in this most important crisis, when the fate of empire depends upon your wisdom and conduct. I greatly rejoice to hear of your union and determination to stand by us.", "", "We cannot but consider the great distance you are from us as a very great misfortune, when our critical situation renders it necessary to hear from you every week, and will be more and more so, as difficulties arise. We now expect our seacoast ravaged; perhaps the very next letter I write will inform you that I am driven away from our yet quiet cottage. Necessity will oblige Gage to take some desperate steps. We are told for truth that he is now eight thousand strong. We live in continual expectation of alarms. Courage I know we have in abundance; conduct I hope we shall not want; but powder,--where shall we get a sufficient supply? I wish we may not fail there. Every town is filled with the distressed inhabitants of Boston. Our house among others is deserted, and by this time, like enough, made use of as a barrack. Mr. Bowdoin and his lady are at present in the house of Mrs. Borland, and are going to Middleborough, to the house of Judge Oliver. He, poor gentleman, is so low that I apprehend he is hastening to a house not made with hands; he looks like a mere skeleton, speaks faint and low, is racked with a violent cough, and, I think, far advanced in a consumption. I went to see him last Saturday. He is very inquisitive of every person with regard to the times; begged I would let him know of the first intelligence I had from you; is very unable to converse by reason of his cough. He rides every pleasant day, and has been kind enough to call at the door (though unable to get out) several times. He says the very name of Hutchinson distresses him. Speaking of him, the other day, he broke out, \"Religious rascal! how I abhor his name!\"", "", "Pray be as particular as possible when you write. Everybody wants to hear and to know what is doing, and what may be communicated do not fail to inform me of. All our friends desire to be kindly remembered to you. Gage's proclamation you will receive by this conveyance. All the records of time cannot produce a blacker page. Satan, when driven from the regions of bliss, exhibited not more malice. Surely the father of lies is superseded. Yet we think it the best proclamation he could have issued.", "", "I shall, whenever I can, receive and entertain, in the best manner I am capable, the gentlemen who have so generously proffered their services in our army. Government is wanted in the army and elsewhere. We see the want of it more from so large a body being together, than when each individual was employed in his own domestic circle. My best regards attend every man you esteem. You will make my compliments to Mr. Mifflin and lady. I do not now wonder at the regard the ladies express for a soldier. Every man who wears a cockade appears of double the importance he used to do, and I feel a respect for the lowest subaltern in the army. You tell me you know not when you shall see me. I never trust myself long with the terrors which sometimes intrude themselves upon me.", "", "I hope we shall see each other again, and rejoice together in happier days; the little ones are well, and send duty to papa. Don't fail of letting me hear from you by every opportunity. Every line is like a precious relic of the saints.", "", "I have a request to make of you; something like the barrel of sand, I suppose you will think it, but really of much more importance to me. It is, that you would send out Mr. Bass, and purchase me a bundle of pins and put them in your trunk for me. The cry for pins is so great that what I used to buy for seven shillings and sixpence are now twenty shillings, and not to be had for that. A bundle contains six thousand, for which I used to give a dollar; but if you can procure them for fifty shillings, or three pounds, pray let me have them.", "", "I am, with the tenderest regard,", "", "Your", "", "PORTIA."], "corpus/1776-march-31-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 31 March, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 31 March, 1776", "Source letter number: 91", "", "I wish you would ever write me a letter half as long as I write you, and tell me, if you may, where your fleet are gone; what sort of defense Virginia can make against our common enemy; whether it is so situated as to make an able defense. Are not the gentry lords, and the common people vassals? Are they not like the uncivilized vassals Britain represents us to be? I hope their riflemen, who have shown themselves very savage and even blood-thirsty, are not a specimen of the generality of the people. I am willing to allow the colony great merit for having produced a Washington; but they have been shamefully duped by a Dunmore.", "", "I have sometimes been ready to think that the passion for liberty cannot be equally strong in the breasts of those who have been accustomed to deprive their fellow-creatures of theirs. Of this I am certain, that it is not founded upon that generous and Christian principle of doing to others as we would that others should do unto us.", "", "Do not you want to see Boston? I am fearful of the small-pox, or I should have been in before this time. I got Mr. Crane to go to our house and see what state it was in. I find it has been occupied by one of the doctors of a regiment; very dirty, but no other damage has been done to it. The few things which were left in it are all gone. I look upon it as a new acquisition of property--a property which one month ago I did not value at a single shilling, and would with pleasure have seen it in flames.", "", "The town in general is left in a better state than we expected; more owing to a precipitate flight than any regard to the inhabitants; though some individuals discovered a sense of honor and justice, and have left the rent of the houses in which they were, for the owners, and the furniture unhurt, or, if damaged, sufficient to make it good. Others have committed abominable ravages. The mansion-house of your President is safe, and the furniture unhurt; while the house and furniture of the Solicitor General have fallen a prey to their own merciless party. Surely the very fiends feel a reverential awe for virtue and patriotism, whilst they detest the parricide and traitor.", "", "I feel very differently at the approach of spring from what I did a month ago. We knew not then whether we could plant or sow with safety, whether where we had tilled we could reap the fruits of our own industry, whether we could rest in our own cottages or whether we should be driven from the seacoast to seek shelter in the wilderness; but now we feel a temporary peace, and the poor fugitives are returning to their deserted habitations.", "", "Though we felicitate ourselves, we sympathize with those who are trembling lest the lot of Boston should be theirs. But they cannot be in similar circumstances unless pusillanimity and cowardice should take possession of them. They have time and warning given them to see the evil and shun it.", "", "I long to hear that you have declared an independency. And, by the way, in the new code of laws which I suppose it will be necessary for you to make, I desire you would remember the ladies and be more generous and favorable to them than your ancestors. Do not put such unlimited power into the hands of the husbands. Remember, all men would be tyrants if they could. If particular care and attention is not paid to the ladies, we are determined to foment a rebellion, and will not hold ourselves bound by any laws in which we have no voice or representation.", "", "That your sex are naturally tyrannical is a truth so thoroughly established as to admit of no dispute; but such of you as wish to be happy willingly give up the harsh title of master for the more tender and endearing one of friend. Why, then, not put it out of the power of the vicious and the lawless to use us with cruelty and indignity with impunity? Men of sense in all ages abhor those customs which treat us only as the vassals of your sex; regard us then as beings placed by Providence under your protection, and in imitation of the Supreme Being make use of that power only for our happiness.", "", "April 5.", "", "I want to hear much oftener from you than I do. March 8th was the last date of any that I have yet had. You inquire of me whether I am making saltpetre. I have not yet attempted it, but after soap-making believe I shall make the experiment. I find as much as I can do to manufacture clothing for my family, which would else be naked. I know of but one person in this part of the town who has made any. That is Mr. Tertius Bass, as he is called, who has got very near a hundred-weight which has been found to be very good. I have heard of some others in the other parishes. Mr. Reed, of Weymouth, has been applied to, to go to Andover to the mills which are now at work, and he has gone.", "", "I have lately seen a small manuscript describing the proportions of the various sorts of powder fit for cannon, small-arms, and pistols. If it would be of any service your way I will get it transcribed and send it to you. Every one of your friends sends regards, and all the little ones. Adieu."], "corpus/1775-december-10-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 10 December, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 10 December, 1775", "Source letter number: 81", "", "I received your obliging favor by Mrs. Morgan, with the papers and the other articles you sent, which were very acceptable to me, as they are not to be purchased here. I shall be very choice of them.", "", "I have, according to your desire, been upon a visit to Mrs. Morgan, who keeps at Major Mifflin's. I had received a message from Mrs. Mifflin some time ago, desiring I would visit her. My father, who, you know, is very obliging in this way, accompanied me, and I had the pleasure of drinking coffee with the Doctor and his lady, the Major and his lady, and a Mr. and Mrs. Smith from New York, a daughter of the famous son of liberty, Captain Sears; Generals Gates and Lee; a Dr. M'Henry and a Mr. Elwyn, with many others who were strangers to me. I was very politely entertained, and noticed by the generals; more especially General Lee, who was very urgent with me to tarry in town, and dine with him and the ladies present, at Hobgoblin Hall, but I excused myself. The General was determined that I should not only be acquainted with him, but with his companions too, and therefore placed a chair before me, into which he ordered Mr. Spada to mount and present his paw to me for a better acquaintance. I could not do otherwise than accept it. \"That, Madam,\" says he, \"is the dog which Mr. ---- has rendered famous.\"", "", "I was so little while in company with these persons, and the company so mixed, that it was almost impossible to form any judgment of them. The Doctor appeared modest, and his lady affable and agreeable. Major Mifflin, you know, I was always an admirer of, as well as of his delicate lady. I believe Philadelphia must be an unfertile soil, or it would not produce so many unfruitful women. I always conceive of these persons as wanting one addition to their happiness; but in these perilous times, I know not whether it ought to be considered as an infelicity, since they are certainly freed from the anxiety every parent must feel for their rising offspring.", "", "I drank coffee one day with General Sullivan upon Winter Hill. He appears to be a man of sense and spirit. His countenance denotes him of a warm constitution, not to be very suddenly moved, but, when once roused, not very easily lulled,--easy and social,--well calculated for a military station, as he seems to be possessed of those popular qualities necessary to attach men to him.", "", "By the way, I congratulate you upon our late noble acquisition of military stores. It is a most grand mortar, I assure you. Surely Heaven smiles upon us, in many respects, and we have continually to speak of mercies, as well as of judgments. I wish our gratitude may be anywise proportionate to our benefits. I suppose, in Congress, you think of everything relative to trade and commerce, as well as other things; but, as I have been desired to mention to you some things, I shall not omit them. One is, that there may be something done, in a Continental way, with regard to excise upon spirituous liquors, that each of the New England colonies may be upon the same footing; whereas we formerly used to pay an excise, and the other colonies none, or very little, by which means they drew away our trade. An excise is necessary, though it may be objected to by the mercantile interest, as a too frequent use of spirits endangers the well-being of society. Another article is, that some method may be devised to keep among us our gold and silver, which are now every day shipped off to the West Indies for molasses, coffee, and sugar; and this I can say of my own knowledge, that a dollar in silver is now become a great rarity, and our traders will give you a hundred pounds of paper for ninety of silver, or nearly that proportion. If any trade is allowed to the West Indies, would it not be better to carry some commodity of our own produce in exchange? Medicines, cotton-wool, and some other articles, we are in great want of. Formerly we used to purchase cotton-wool at one shilling, lawful money, per bag; now it is three, and the scarcity of that article distresses us, as it was wrought up with less trouble than any other article of clothing. Flax is now from a shilling to one and sixpence per pound, sheep's wool eighteenpence, and linens not to be had at any price. I cannot mention the article in the English goods way which is not double; and in the West India molasses by retail I used formerly to purchase at one and eightpence, now it is two and eightpence; rum, three shillings; coffee, one and threepence, and all other things in proportion. Corn is four shillings per bushel; rye, five; oats, three and eightpence; hay, five and six shillings per hundred; wood, twenty shillings per cord; but meat of all kinds cheap.", "", "My uncle Quincy desires to be remembered to you; he inquired when you talked of coming home. I told him you had not fixed any time. He says, if you don't come soon, he would advise me to procure another husband. He, of all persons, ought not to give me such advice, I told him, unless he set a better example himself.", "", "Be kind enough to burn this letter. It is written in great haste, and a most incorrect scrawl it is. But I cannot conclude without telling you we are all very angry with your House of Assembly for their instructions. They raise prejudices in the minds of people, and serve to create in their minds a terror at a separation from a people wholly unworthy of us. We are a little of the spaniel kind; though so often spurned, still to fawn argues a meanness of spirit, that, as an individual, I disclaim, and would rather endure any hardship than submit to it.", "", "Yours."], "corpus/1775-september-17-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 17 September, 1775", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 17 September, 1775", "Source letter number: 61", "", "This is the first time that I have attempted to write since I left you. I arrived here in good health, after an agreeable journey, last Wednesday. There had not been members enough to make a House, several colonies being absent, so that I was just in time. The next day an adequate number appeared, and Congress has sat ever since. Georgia is now fully represented, and united to the other twelve. Their delegates are Doctor Zubly, a clergyman of the Independent persuasion, who has a parish in that colony, and a good deal of property. He is a native of Switzerland; is a man of learning and ingenuity. It is said he is master of several languages--Greek, Latin, French, Dutch, and English; in the latter it is said he writes tolerably. He is a man of zeal and spirit, as we have already seen upon several occasions. However, as he is the first gentleman of the cloth who has appeared in Congress, I cannot but wish he may be the last. Mixing the sacred character with that of the statesman, as it is quite unnecessary at this time of day, in these colonies, is not attended with any good effects. The clergy are universally too little acquainted with the world and the modes of business, to engage in civil affairs with any advantage. Besides, those of them who are really men of learning, have conversed with books so much more than men as to be too much loaded with vanity to be good politicians. Mr. Bullock is another of the Georgia delegates--a sensible man--a planter, I suppose. Mr. Houston is the third, a young lawyer, of modesty as well as sense and spirit, which you will say is uncommon.", "", "Mr. Jones and Doctor Hall are not yet arrived.", "", "Mr. Henry is made a General in Virginia, and therefore could not come. Mr. Pendleton and Colonel Bland excused themselves on account of age and ill-health. Messrs. Nelson, Wythe, and Lee are chosen, and are here in the stead of the other three. Wythe and Lee are inoculated. You shall hear more about them. Although they come in the room of very good men, we have lost nothing by the change, I believe. Remember me in the tenderest language to all our little folks. I am yours."], "corpus/1776-july-03-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 3 July, 1776", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 3 July, 1776", "Source letter number: 115", "", "Had a Declaration of Independency been made seven months ago, it would have been attended with many great and glorious effects. We might, before this hour, have formed alliances with foreign states. We should have mastered Quebec, and been in possession of Canada. You will perhaps wonder how such a declaration would have influenced our affairs in Canada, but if I could write with freedom, I could easily convince you that it would, and explain to you the manner how. Many gentlemen in high stations, and of great influence, have been duped by the ministerial bubble of Commissioners to treat. And in real, sincere expectation of this event, which they so fondly wished, they have been slow and languid in promoting measures for the reduction of that province. Others there are in the Colonies who really wished that our enterprise in Canada would be defeated, that the Colonies might be brought into danger and distress between two fires, and be thus induced to submit. Others really wished to defeat the expedition to Canada, lest the conquest of it should elevate the minds of the people too much to hearken to those terms of reconciliation which, they believed, would be offered us. These jarring views, wishes, and designs occasioned an opposition to many salutary measures which were proposed for the support of that expedition, and caused obstructions, embarrassments, and studied delays, which have finally lost us the province.", "", "All these causes, however, in conjunction would not have disappointed us, if it had not been for a misfortune which could not be foreseen, and perhaps could not have been prevented; I mean the prevalence of the small-pox among our troops. This fatal pestilence completed our destruction. It is a frown of Providence upon us, which we ought to lay to heart.", "", "But, on the other hand, the delay of this Declaration to this time has many great advantages attending it. The hopes of reconciliation which were fondly entertained by multitudes of honest and well-meaning, though weak and mistaken people, have been gradually, and at last totally extinguished. Time has been given for the whole people maturely to consider the great question of independence, and to ripen their judgment, dissipate their fears, and allure their hopes, by discussing it in newspapers and pamphlets, by debating it in assemblies, conventions, committees of safety and inspection, in town and county meetings, as well as in private conversations, so that the whole people, in every colony of the thirteen, have now adopted it as their own act. This will cement the union, and avoid those heats, and perhaps convulsions, which might have been occasioned by such a Declaration six months ago.", "", "But the day is past. The second day of July, 1776, will be the most memorable epocha in the history of America. I am apt to believe that it will be celebrated by succeeding generations as the great anniversary festival.", "", "It ought to be commemorated as the day of deliverance, by solemn acts of devotion to God Almighty. It ought to be solemnized with pomp and parade, with shows, games, sports, guns, bells, bonfires, and illuminations, from one end of this continent to the other, from this time forward forevermore.", "", "You will think me transported with enthusiasm, but I am not. I am well aware of the toil and blood and treasure that it will cost us to maintain this Declaration and support and defend these States. Yet, through all the gloom, I can see the rays of ravishing light and glory. I can see that the end is more than worth all the means. And that posterity will triumph in that day's transaction, even although we should rue it, which I trust in God we shall not."], "corpus/1776-june-03-abigail-adams.txt": ["Title: Abigail Adams to John Adams, 3 June, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: 3 June, 1776", "Source letter number: 110", "", "I received by Mr. Church a few lines from you. I wish to hear from you every opportunity, though you say no more than that you are well. I feel concerned lest your clothes should go to rags, having nobody to take any care of you in your long absence; and then, you have not with you a proper change for the seasons. However, you must do the best you can. I have a suit of homespun for you whenever you return. I cannot avoid sometimes repining that the gifts of fortune were not bestowed upon us, that I might have enjoyed the happiness of spending my days with my partner, but as it is, I think it my duty to attend with frugality and economy to our own private affairs; and if I cannot add to our little substance, yet see it that it is not diminished. I should enjoy but little comfort in a state of idleness and uselessness. Here I can serve my partner, my family, and myself, and enjoy the satisfaction of your serving your country.", "", "I wish you would write me what I had best do with our house at Boston. I would advertise it if you think best. There are so many houses torn to pieces and so many others abused, that I might stand a chance of letting it, perhaps, as it is in so good repair.", "", "My brother is desirous of joining the army again, but would choose to be a field-officer. I have mentioned him to some of the House, and suppose he will be recommended to Congress for a commission. I hardly know where you will find men to form the regiments required. I begin to think population a very important branch in the American manufactories.", "", "I inclose a list of the Council. The House consists of more than two hundred and fifty members. Your former pupil Angier comes from Bridgewater, and five others. I hope they will proceed in business with a little more spirit than heretofore. They are procuring two row-galleys, but when they will be finished I know not. I thought they were near done, but find to-day they are not yet contracted for. All our gentry are gone from Nantasket Road except the _Commodore_ and one or two small craft.", "", "Everything bears a very great price. The merchant complains of the farmer and the farmer of the merchant--both are extravagant. Living is double what it was one year ago.", "", "I find you have licensed tea, but I am determined not to be a purchaser unless I can have it at Congress price, and in that article the venders pay no regard to Congress, asking ten, eight, and the lowest is seven and sixpence per pound. I should like a little green, but they say there is none to be had here. I only wish it for a medicine, as a relief to a nervous pain in my head to which I am sometimes subject. Were it as plenty as ever, I would not practice the use of it.", "", "Our family are all well. It has been reported here that Congress were going to remove forty miles beyond Philadelphia. I gave no credit to the report. I heard no reason assigned for it. I had much rather they would come a hundred miles nearer here. Adieu. Yours."], "corpus/1776-march-17-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 17 March, 1776", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 17 March, 1776", "Source letter number: 88", "", "Our worthy friend, Frank Dana, arrived here last evening from New York, to which place he came lately from England in the packet. In company with him is a gentleman by the name of Wrixon, who has been a field-officer in the British army, served all the last war in Germany, and has seen service in every part of Europe. He left the army some time ago, and studied law in the Temple, in which science he made a great proficiency. He wrote, lately, a pamphlet under the title of \"The Rights of Britons,\" which he has brought over with him. He is a friend of liberty, and thinks justly of the American question. He has great abilities, as well as experience in the military science, and is an able engineer. I hope we shall employ him.", "", "The Baron de Woedtke we have made a Brigadier-general, and ordered him to Canada. The testimonials in his favor I shall inclose to you. Mr. Dana's account, with which Mr. Wrixon's agrees, ought to extinguish, in every mind, all hopes of reconciliation with Great Britain. This delusive hope has done us great injuries, and, if ever we are ruined, will be the cause of our fall. A hankering after the leeks of Egypt makes us forget the cruelty of her task-masters.", "", "I shall suffer many severe pains on your account for some days. By a vessel from Salem a cannonade was heard from dark till nine o'clock, last night was a week ago. Your vicinity to such scenes of carnage and desolation as, I fear, are now to be seen in Boston and its environs, will throw you into much distress, but I believe in my conscience, I feel more here than you do. The sound of cannon was not so terrible when I was at Braintree as it is here, though I hear it at four hundred miles distance.", "", "You can't imagine what a mortification I sustain in not having received a single line from you since we parted. I suspect some villainy in conveyance. By the relation of Mr. Dana, Mr. Wrixon, and Mr. Temple, Mr. Hutchinson, Mr. Sewall, and their associates are in great disgrace in England. Persons are ashamed to be seen to speak to them. They look despised and sunk.", "", "I shall inclose an extract of a letter from Mons. Dubourg in Paris, and a testimonial in favor of our Prussian General. Adieu."], "corpus/1775-may-04-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Braintree, 4 May, 1775", "Author: Abigail Adams", "Recipient: John Adams", "Date: Braintree, 4 May, 1775", "Source letter number: 32", "", "I have but little news to write you. Everything of that kind you will learn by a more accurate hand than mine. Things remain in much the same situation here that they were when you went away. There has been no descent upon the seacoast. Guards are regularly kept, and people seem more settled and are returning to their husbandry. I feel somewhat lonely. Mr. Thaxter is gone home. Mr. Rice is going into the army, as captain of a company. We have no school. I know not what to do with John. As government is assumed, I suppose courts of justice will be established, and in that case there may be business to do. If so, would it not be best for Mr. Thaxter to return? They seem to be discouraged in the study of law, and think there never will be any business for them. I could have wished they had consulted you upon the subject, before you went away.", "", "I suppose you will receive two or three volumes of that forlorn wretch Hutchinson's letters. Among many other things, I hear he wrote in 1772, that Deacon Phillips and you had like to have been chosen into the Council, but, if you had, you should have shared the same fate with Bowers. May the fate of Mordecai be his. There is nobody admitted into town yet. I have made two or three attempts to get somebody in, but cannot succeed; so have not been able to do the business you left in charge with me. I want very much to hear from you, how you stood your journey, and in what state you find yourself now. I felt very anxious about you; though I endeavored to be very insensible and heroic, yet my heart felt like a heart of lead. The same night you left me, I heard of Mr. Quincy's death, which, at this time, was a most melancholy event; especially as he wrote in minutes, which he left behind, that he had matters of consequence intrusted with him, which, for want of a confidant, must die with him. I went to see his distressed widow last Saturday, at the Colonel's; and in the afternoon, from an alarm they had, she and her sister, with three others of the family, took refuge with me and tarried all night. She desired me to present her regards to you, and let you know she wished you every blessing,--should always esteem you as a sincere friend of her deceased husband. Poor, afflicted woman; my heart was wounded for her. I must quit the subject, and entreat you to write me by every opportunity.", "", "Yours,", "", "PORTIA."], "corpus/1776-july-13-abigail-adams.txt": ["Title: Abigail Adams to John Adams, Boston, 13 July, 1776", "Author: Abigail Adams", "Recipient: John Adams", "Date: Boston, 13 July, 1776", "Source letter number: 120", "", "I must begin with apologizing to you for not writing since the 17th of June. I have really had so many cares upon my hands and mind, with a bad inflammation in my eyes, that I have not been able to write. I now date from Boston, where I yesterday arrived and was with all of our little ones inoculated for the small-pox....", "", "As to news, we have taken several prizes since I wrote you, as you will see by the newspapers. The present report is of Lord Howe's coming with unlimited powers. However, suppose it is so, I believe he little thinks of treating with us as Independent States. How can any person yet dream of a settlement, accommodations, etc.? They have neither the spirit nor the feeling of men. Yet I see some who never were called Tories gratified with the idea of Lord Howe's being upon his passage with such powers!", "", "Sunday, 14 July.", "", "By yesterday's post I received two letters dated 3d and 4th of July, and though your letters never fail to give me pleasure, be the subject what it will, yet it was greatly heightened by the prospect of the future happiness and glory of our country. Nor am I a little gratified when I reflect that a person so nearly connected with me has had the honor of being a principal actor in laying a foundation for its future greatness.", "", "May the foundation of our new Constitution be Justice, Truth, Righteousness! Like the wise man's house, may it be founded upon these rocks, and then neither storms nor tempests will overthrow it!", "", "I cannot but be sorry that some of the most manly sentiments in the Declaration are expunged from the printed copy. Perhaps wise reasons induced it.", "", "I shall write you now very often. Pray inform me constantly of every important action. Every expression of tenderness is a cordial to my heart. Important as they are to the rest of the world, to me they are _everything_.", "", "I suppose you have heard of a fleet which came up pretty near the Light and kept us all with our mouths open, ready to catch them, but after staying near a week, and making what observations they could, set sail and went off, to our great mortification, who were ---- for them in every respect. If our ship of thirty-two guns which was built at Portsmouth, and waiting only for guns, and another at Plymouth in the same state, had been in readiness, we should in all probability have been masters of them. Where the blame lies in that respect, I know not. 'T is laid upon Congress, and Congress is also blamed for not appointing us a General. But Rome was not built in a day.", "", "All our friends desire to be remembered to you, and foremost in that number stands your", "", "PORTIA."]}};
    const docTexts = data.document_texts || {};
    const state = { selectedCode: null, scope: "all", search: "" };

    const codeListEl = document.getElementById("code-list");
    const snippetListEl = document.getElementById("snippet-list");
    const summaryEl = document.getElementById("summary");
    const footerEl = document.getElementById("footer");
    const searchEl = document.getElementById("search");
    const scopeButtons = Array.from(document.querySelectorAll("[data-scope]"));

    function escapeHtml(v) {
      return v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    function cardForCode(code) {
      const sel = state.selectedCode === code.code_id;
      return `<div class="code-card ${sel ? "is-selected" : ""}" data-code-id="${code.code_id}">
        <div class="code-top">
          <span class="swatch" style="background:${code.display_color}"></span>
          <span class="code-name">${escapeHtml(code.name)}</span>
        </div>
        <div class="code-meta">${code.annotation_count} annot · ${code.document_count} doc${code.document_count !== 1 ? "s" : ""}</div>
      </div>`;
    }

    function buildContextHtml(snippet) {
      if (snippet.scope_type === "document") {
        const lines = docTexts[snippet.document_path];
        if (lines && lines.length > 0) {
          const maxLines = Math.min(lines.length, 60);
          let parts = lines.slice(0, maxLines).map(l => `<span class="ctx">${escapeHtml(l)}</span>`);
          if (lines.length > maxLines) {
            parts.push(`<span class="ctx">... (${lines.length - maxLines} more lines)</span>`);
          }
          return `<pre>${parts.join("\n")}</pre>`;
        }
        return `<pre>&lt;document-level annotation&gt;</pre>`;
      }
      const lines = docTexts[snippet.document_path];
      if (!lines) {
        return `<pre>${escapeHtml(snippet.exact_text || "")}</pre>`;
      }
      const start = snippet.start_line;
      const end = snippet.end_line;
      const ctxBefore = Math.max(0, start - 1 - 10);
      const ctxAfter = Math.min(lines.length, end + 10);
      let parts = [];
      for (let i = ctxBefore; i < ctxAfter; i++) {
        const lineNum = i + 1;
        const escaped = escapeHtml(lines[i]);
        if (lineNum >= start && lineNum <= end) {
          parts.push(`<span class="hl">${escaped}</span>`);
        } else {
          parts.push(`<span class="ctx">${escaped}</span>`);
        }
      }
      return `<pre>${parts.join("\n")}</pre>`;
    }

    function snippetCard(snippet) {
      const range = snippet.scope_type === "document"
        ? "Whole document"
        : `Lines ${snippet.start_line}–${snippet.end_line}`;
      const memo = snippet.memo ? `<div class="memo">${escapeHtml(snippet.memo)}</div>` : "";
      const contextHtml = buildContextHtml(snippet);
      return `<article class="snippet">
        <div class="snippet-head">
          <div class="snippet-title">
            <span class="chip"><span class="swatch" style="background:${snippet.code_color}"></span>${escapeHtml(snippet.code_name)}</span>
          </div>
          <div class="snippet-meta">${escapeHtml(snippet.document_path)} &middot; ${escapeHtml(range)}</div>
        </div>
        <div class="context-scroll">${contextHtml}<button class="recenter" type="button">&uarr; Back to highlight</button></div>
        ${memo}
      </article>`;
    }

    function matchesSnippet(s) {
      if (state.selectedCode && s.code_id !== state.selectedCode) return false;
      if (state.scope !== "all" && s.scope_type !== state.scope) return false;
      if (!state.search) return true;
      return [s.code_name, s.document_path, s.memo||"", s.exact_text||""].join("\n").toLowerCase().includes(state.search);
    }

    function renderSummary(snippets) {
      const codes = state.selectedCode ? 1 : data.codes.length;
      const docs = new Set(snippets.map(s => s.document_path)).size;
      const conflicted = snippets.filter(s => s.anchor_status === "conflicted").length;
      summaryEl.innerHTML = [
        `<span><span class="stat-value">${codes}</span> codes</span>`,
        `<span><span class="stat-value">${snippets.length}</span> snippets</span>`,
        `<span><span class="stat-value">${docs}</span> documents</span>`,
        conflicted ? `<span><span class="stat-value">${conflicted}</span> conflicted</span>` : "",
      ].filter(Boolean).join("");
    }

    function renderCodes() {
      codeListEl.innerHTML = data.codes.map(cardForCode).join("");
      for (const n of codeListEl.querySelectorAll(".code-card")) {
        n.addEventListener("click", () => {
          const id = n.getAttribute("data-code-id");
          state.selectedCode = state.selectedCode === id ? null : id;
          render();
        });
      }
    }

    function renderSnippets() {
      const filtered = data.snippets.filter(matchesSnippet);
      snippetListEl.innerHTML = filtered.length
        ? filtered.map(snippetCard).join("")
        : `<div class="empty">No snippets match the current filters.</div>`;
      renderSummary(filtered);
      // Auto-scroll highlighted text into view and wire up recenter buttons
      for (const el of snippetListEl.querySelectorAll(".context-scroll")) {
        const hl = el.querySelector(".hl");
        if (!hl) continue;
        const scrollToHl = () => {
          const top = hl.offsetTop - el.offsetTop - el.clientHeight / 3;
          el.scrollTop = Math.max(0, top);
          el.classList.remove("scrolled-away");
        };
        scrollToHl();
        el.addEventListener("scroll", () => {
          const hlTop = hl.offsetTop - el.offsetTop;
          const visible = hlTop >= el.scrollTop && hlTop < el.scrollTop + el.clientHeight;
          el.classList.toggle("scrolled-away", !visible);
        });
        const btn = el.querySelector(".recenter");
        if (btn) btn.addEventListener("click", scrollToHl);
      }
      footerEl.textContent = `Generated ${data.generated_at}`;
    }

    function render() {
      scopeButtons.forEach(b => b.classList.toggle("is-active", b.dataset.scope === state.scope));
      renderCodes();
      renderSnippets();
    }

    searchEl.addEventListener("input", e => {
      state.search = e.target.value.trim().toLowerCase();
      renderSnippets();
    });
    for (const b of scopeButtons) {
      b.addEventListener("click", () => { state.scope = b.dataset.scope; render(); });
    }
    document.getElementById("clear-filters").addEventListener("click", () => {
      state.selectedCode = null; state.scope = "all"; state.search = ""; searchEl.value = "";
      render();
    });
    render();
  </script>
</body>
</html>
