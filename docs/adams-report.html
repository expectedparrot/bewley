its rage, and humble us under the ravages already made by it. The sorrows of all our friends, on the loss of your mother, are never out of my mind. I pray God to spare my parent, whose life has been prolonged by his goodness hitherto, as well as yours that survives. The tremendous calamities already felt, of fire, sword, and pestilence, may be only harbingers of greater still. We have no security against calamity here. This planet is its region. The only principle is to be prepared for the worst events.", "", "If I could write as well as you, my sorrow would be as eloquent as yours, but, upon my word, I cannot.", "", "The unaccountable event which you allude to has reached this place and occasioned a fall. I would be glad, however, that the worst construction might not be put. Let him have fair play; though I doubt.", "", "The man who violates private faith, cancels solemn obligations, whom neither honor nor conscience holds, shall never be knowingly trusted by me. Had I known, when I first voted for a Director of an Hospital, what I heard afterwards, when I was down, I would not have voted as I did. Open, barefaced immorality ought not to be so countenanced. Though I think a fatality attends us in some instances, yet a divine protection and favor is visible in others; and let us be cheerful, whatever happens. Cheerfulness is not a sin in any times.", "", "I am afraid to hear again, almost, lest some other should be sick in the house. Yet I hope better, and that you will reassume your wonted cheerfulness and write again upon news and politics. Send your letters to Warren for conveyance. I won't trust any other."], "corpus/1775-december-03-john-adams.txt": ["Title: John Adams to Abigail Adams, Philadelphia, 3 December, 1775", "Author: John Adams", "Recipient: Abigail Adams", "Date: Philadelphia, 3 December, 1775", "Source letter number: 80", "", "My best Friend,--Yours of November 12th is before me. I wish I could write you every day, more than once, for although I have a number of friends and many relations who are very dear to me, yet all the friendship I have for others is far unequal to that which warms my heart for you. The most agreeable time that I spend here is in writing to you, and conversing with you, when I am alone. But the call of friendship and of private affection must give place to that of duty and honor. Even private friendship and affections require it.", "", "I am obliged, by the nature of the service I am in, to correspond with many gentlemen, both of the army and of the two houses of Assembly, which takes up much of my time. How I find time to write half the letters I do, I know not, for my whole time seems engrossed with business. The whole Congress is taken up, almost, in different committees, from seven to ten in the morning. From ten to four or sometimes five, we are in Congress, and from six to ten in committees again. I don't mention this to make you think me a man of importance, because it is not I alone, but the whole Congress is thus employed, but to apologize for not writing to you oftener.", "", "Indeed, I know not what to write that is worth your reading. I send you the papers, which inform you of what is public. As to what passes in Congress, I am tied fast by my honor to communicate nothing. I hope the Journal of the Session will be published soon, and then you will see what we have been about in one view, excepting what ought to be excepted. If I could visit the coffee-houses in the evening, and the coffee-tables of the ladies in the afternoon, I could entertain you with many smart remarks upon dress and air, etc., and give you many sprightly conversations, but my fate, you know, is to be moping over books and papers all the leisure time I have, when I have any.", "", "I hope I shall be excused from coming to Philadelphia again, at least until other gentlemen have taken their turns. But I never will come here again without you, if I can persuade you to come with me. Whom God has joined together ought not to be put asunder so long, with their own consent. We will bring master Johnny with us; you and he shall have the small-pox here, and we will be as happy as Mr. Hancock and his lady. Thank Abby and John for their letters, and kiss Charles and Tom for me. John writes like a hero, glowing with ardor for his country and burning with indignation against her enemies.", "", "As to coming home, I have no thoughts of it; shall stay here till the year is out, for what I know. Affairs are in a critical state, and important steps are now taking every day, so that I could not reconcile it to my own mind to be absent from this place at present. Nothing is expected from the Commissioners, yet we are waiting for them in some respects. The Tories and timids pretend to expect great things from them. But the generality expect nothing but more insults and affronts. Privateering is licensed, and the ports are wide open. As soon as the resolves are printed, which will be to-morrow, I will send them."], "corpus/1776-april-14-john-adams.txt": ["Title: John Adams to Abigail Adams, 14 April, 1776", "Author: John Adams", "Recipient: Abigail Adams", "Date: 14 April, 1776", "Source letter number: 94", "", "You justly complain of my short letters, but the critical state of things and the multiplicity of avocations must plead my excuse. You ask where the fleet is? The inclosed papers will inform you. You ask what sort of defense Virginia can make? I believe they will make an able defense. Their militia and minute-men have been some time employed in training themselves, and they have nine battalions of regulars, as they call them, maintained among them, under good officers, at the Continental expense. They have set up a number of manufactories of firearms, which are busily employed. They are tolerably supplied with powder, and are successful and assiduous in making saltpetre. Their neighboring sister, or rather daughter colony of North Carolina, which is a warlike colony, and has several battalions at the Continental expense, as well as a pretty good militia, are ready to assist them, and they are in very good spirits and seem determined to make a brave resistance. The gentry are very rich, and the common people very poor. This inequality of property gives an aristocratical turn to all their proceedings, and occasions a strong aversion in their patricians to \"Common Sense.\" But the spirit of these Barons is coming down, and it must submit. It is very true, as you observe, they have been duped by Dunmore. But this is a common case. All the colonies are duped, more or less, at one time and another. A more egregious bubble was never blown up than the story of Commissioners coming to treat with the Congress, yet it has gained credit like a charm, not only with, but against the clearest evidence. I never shall forget the delusion which seized our best and most sagacious friends, the dear inhabitants of Boston, the winter before last. Credulity and the want of foresight are imperfections in the human character, that no politician can sufficiently guard against.", "", "You give me some pleasure by your account of a certain house in Queen Street. I had burned it long ago in imagination. It rises now to my view like a phoenix. What shall I say of the Solicitor General? I pity his pretty children. I pity his father and his sisters. I wish I could be clear that it is no moral evil to pity him and his lady. Upon repentance, they will certainly have a large share in the compassions of many. But let us take warning, and give it to our children. Whenever vanity and gayety, a love of pomp and dress, furniture, equipage, buildings, great company, expensive diversions, and elegant entertainments get the better of the principles and judgments of men or women, there is no knowing where they will stop, nor into what evils, natural, moral, or political, they will lead us.", "", "Your description of your own _gaieté de coeur_ charms me. Thanks be to God, you have just cause to rejoice, and may the bright prospect be obscured by no cloud. As to declarations of independency, be patient. Read our privateering laws and our commercial laws. What signifies a word?", "", "As to your extraordinary code of laws, I cannot but laugh. We have been told that our struggle has loosened the bonds of government everywhere; that children and apprentices were disobedient; that schools and colleges were grown turbulent; that Indians slighted their guardians, and negroes grew insolent to their masters. But your letter was the first intimation that another tribe, more numerous and powerful than all the rest, were grown discontented. This is rather too coarse a compliment, but you are so saucy, I won't blot it out. Depend upon it, we know better than to repeal our masculine systems. Although they are in full force, you know they are little more than theory. We dare not exert our power in its full latitude. We are obliged to go fair and softly, and, in practice, you know we are the subjects. We have only the name of masters, and rather than give up this, which would completely subject us to the despotism of the petticoat, I hope General Washington and all our brave heroes would fight; I am sure every good politician would plot, as long as he would against despotism, empire, monarchy, aristocracy, oligarchy, or ochlocracy. A fine story, indeed! I begin to think the ministry as deep as they are wicked. After stirring up Tories, land-jobbers, trimmers, bigots, Canadians, Indians, negroes, Hanoverians, Hessians, Russians, Irish Roman Catholics, Scotch renegadoes, at last they have stimulated the ---- to demand new privileges and threaten to rebel."]}};
    const docTexts = data.document_texts || {};
    const state = { selectedCode: null, scope: "all", search: "" };

    const codeListEl = document.getElementById("code-list");
    const snippetListEl = document.getElementById("snippet-list");
    const summaryEl = document.getElementById("summary");
    const footerEl = document.getElementById("footer");
    const searchEl = document.getElementById("search");
    const scopeButtons = Array.from(document.querySelectorAll("[data-scope]"));

    function escapeHtml(v) {
      return v.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    function cardForCode(code) {
      const sel = state.selectedCode === code.code_id;
      return `<div class="code-card ${sel ? "is-selected" : ""}" data-code-id="${code.code_id}">
        <div class="code-top">
          <span class="swatch" style="background:${code.display_color}"></span>
          <span class="code-name">${escapeHtml(code.name)}</span>
        </div>
        <div class="code-meta">${code.annotation_count} annot · ${code.document_count} doc${code.document_count !== 1 ? "s" : ""}</div>
      </div>`;
    }

    function buildContextHtml(snippet) {
      if (snippet.scope_type === "document") {
        const lines = docTexts[snippet.document_path];
        if (lines && lines.length > 0) {
          const maxLines = Math.min(lines.length, 60);
          let parts = lines.slice(0, maxLines).map(l => `<span class="ctx">${escapeHtml(l)}</span>`);
          if (lines.length > maxLines) {
            parts.push(`<span class="ctx">... (${lines.length - maxLines} more lines)</span>`);
          }
          return `<pre>${parts.join("\n")}</pre>`;
        }
        return `<pre>&lt;document-level annotation&gt;</pre>`;
      }
      const lines = docTexts[snippet.document_path];
      if (!lines) {
        return `<pre>${escapeHtml(snippet.exact_text || "")}</pre>`;
      }
      const start = snippet.start_line;
      const end = snippet.end_line;
      const ctxBefore = Math.max(0, start - 1 - 10);
      const ctxAfter = Math.min(lines.length, end + 10);
      let parts = [];
      for (let i = ctxBefore; i < ctxAfter; i++) {
        const lineNum = i + 1;
        const escaped = escapeHtml(lines[i]);
        if (lineNum >= start && lineNum <= end) {
          parts.push(`<span class="hl">${escaped}</span>`);
        } else {
          parts.push(`<span class="ctx">${escaped}</span>`);
        }
      }
      return `<pre>${parts.join("\n")}</pre>`;
    }

    function snippetCard(snippet) {
      const range = snippet.scope_type === "document"
        ? "Whole document"
        : `Lines ${snippet.start_line}–${snippet.end_line}`;
      const memo = snippet.memo ? `<div class="memo">${escapeHtml(snippet.memo)}</div>` : "";
      const contextHtml = buildContextHtml(snippet);
      return `<article class="snippet">
        <div class="snippet-head">
          <div class="snippet-title">
            <span class="chip"><span class="swatch" style="background:${snippet.code_color}"></span>${escapeHtml(snippet.code_name)}</span>
          </div>
          <div class="snippet-meta">${escapeHtml(snippet.document_path)} &middot; ${escapeHtml(range)}</div>
        </div>
        <div class="context-scroll">${contextHtml}<button class="recenter" type="button">&uarr; Back to highlight</button></div>
        ${memo}
      </article>`;
    }

    function matchesSnippet(s) {
      if (state.selectedCode && s.code_id !== state.selectedCode) return false;
      if (state.scope !== "all" && s.scope_type !== state.scope) return false;
      if (!state.search) return true;
      return [s.code_name, s.document_path, s.memo||"", s.exact_text||""].join("\n").toLowerCase().includes(state.search);
    }

    function renderSummary(snippets) {
      const codes = state.selectedCode ? 1 : data.codes.length;
      const docs = new Set(snippets.map(s => s.document_path)).size;
      const conflicted = snippets.filter(s => s.anchor_status === "conflicted").length;
      summaryEl.innerHTML = [
        `<span><span class="stat-value">${codes}</span> codes</span>`,
        `<span><span class="stat-value">${snippets.length}</span> snippets</span>`,
        `<span><span class="stat-value">${docs}</span> documents</span>`,
        conflicted ? `<span><span class="stat-value">${conflicted}</span> conflicted</span>` : "",
      ].filter(Boolean).join("");
    }

    function renderCodes() {
      codeListEl.innerHTML = data.codes.map(cardForCode).join("");
      for (const n of codeListEl.querySelectorAll(".code-card")) {
        n.addEventListener("click", () => {
          const id = n.getAttribute("data-code-id");
          state.selectedCode = state.selectedCode === id ? null : id;
          render();
        });
      }
    }

    function renderSnippets() {
      const filtered = data.snippets.filter(matchesSnippet);
      snippetListEl.innerHTML = filtered.length
        ? filtered.map(snippetCard).join("")
        : `<div class="empty">No snippets match the current filters.</div>`;
      renderSummary(filtered);
      // Auto-scroll highlighted text into view and wire up recenter buttons
      for (const el of snippetListEl.querySelectorAll(".context-scroll")) {
        const hl = el.querySelector(".hl");
        if (!hl) continue;
        const scrollToHl = () => {
          const top = hl.offsetTop - el.offsetTop - el.clientHeight / 3;
          el.scrollTop = Math.max(0, top);
          el.classList.remove("scrolled-away");
        };
        scrollToHl();
        el.addEventListener("scroll", () => {
          const hlTop = hl.offsetTop - el.offsetTop;
          const visible = hlTop >= el.scrollTop && hlTop < el.scrollTop + el.clientHeight;
          el.classList.toggle("scrolled-away", !visible);
        });
        const btn = el.querySelector(".recenter");
        if (btn) btn.addEventListener("click", scrollToHl);
      }
      footerEl.textContent = `Generated ${data.generated_at}`;
    }

    function render() {
      scopeButtons.forEach(b => b.classList.toggle("is-active", b.dataset.scope === state.scope));
      renderCodes();
      renderSnippets();
    }

    searchEl.addEventListener("input", e => {
      state.search = e.target.value.trim().toLowerCase();
      renderSnippets();
    });
    for (const b of scopeButtons) {
      b.addEventListener("click", () => { state.scope = b.dataset.scope; render(); });
    }
    document.getElementById("clear-filters").addEventListener("click", () => {
      state.selectedCode = null; state.scope = "all"; state.search = ""; searchEl.value = "";
      render();
    });
    render();
  </script>
</body>
</html>
