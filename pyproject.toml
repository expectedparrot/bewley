[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bewley"
version = "0.5.0"
description = "Local-first qualitative coding CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Horton" }]
keywords = ["qualitative-research", "grounded-theory", "coding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.1",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "edsl @ git+https://github.com/expectedparrot/edsl.git@02c9d1c8e273d9257f3f9d5f380b91a18747b8cb"
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "build>=1"]

[project.scripts]
bewley = "bewley.cli:main"

[project.urls]
Homepage = "https://github.com/expectedparrot/bewley"
Documentation = "https://expectedparrot.github.io/bewley/"
Repository = "https://github.com/expectedparrot/bewley"
Issues = "https://github.com/expectedparrot/bewley/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bewley = [
    "docs_content/*.md",
    "schemas/*.json",
    "examples/*/*.md",
    "examples/*/*.txt",
    "examples/*/corpus/*.txt",
]
